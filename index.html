<!-- FÁJLNEV: lib/player/player.html (az export index.html-jének sablonja)
     A régi reader.html-ből átvéve (3. ütem), javítva: adat a data.js-ből (nincs fetch,
     file://-ről is működik), nincs külső betűtípus, van videó- és záró oldal,
     billentyű/egér-vezérlés gépen. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zéország</title>
    
    
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="theme-color" content="#1c1c1f">
    <style>
        /* ZoomComicFX player – 2.5.0 felület (T14/T15/T19/T24/T26, sárga kiemelés a jóváhagyott mockup szerint) */
        :root {
            --pl-bg: #0f0f10; --pl-bar: #1c1c1f; --pl-panel: #232327; --pl-line: #2a2a2f; --pl-line2: #3a3a41;
            --pl-text: #f1f1f1; --pl-dim: #a8a8b0; --pl-accent: #FFC83D; --pl-on-accent: #141416;
            --pl-text-font: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --pl-theme-font: var(--pl-text-font);
        }
        html, body { overscroll-behavior-x: none; }   /* F24/1: a vízszintes suhintás ne váltson böngésző-előzményt */
        button, input, select, textarea { font-family: inherit; }
        #canvasViewport { scrollbar-width: none; touch-action: pan-y; }
        #canvasViewport::-webkit-scrollbar { display: none; }
        body {
            background-color: var(--pl-bg); margin: 0; padding: 0;
            width: 100vw; height: 100vh; overflow: hidden; color: var(--pl-text);
            font-family: var(--pl-text-font);
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        #appBg {
            width: 100vw; height: 100vh; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; box-sizing: border-box; position: relative;
            background-color: var(--pl-bg); background-repeat: no-repeat; background-position: center center;
        }
        /* T21: háttérkép – állón a szélességhez, fekvőn a magassághoz igazítva (a kilógó rész levágódik) */
        #appBg.has-bg-portrait { background-image: var(--bg-portrait); background-size: 100% auto; background-position: var(--bg-portrait-pos, center center); }
        @media (orientation: landscape) {
            #appBg.has-bg-portrait { background-image: none; }
            #appBg.has-bg-landscape { background-image: var(--bg-landscape); background-size: auto 100%; background-position: var(--bg-landscape-pos, center center); }
        }
        @media (orientation: portrait) { #appBg.has-bg-landscape:not(.has-bg-portrait) { background-image: none; } }

        /* ---- felső sor ---- */
        #topBar {
            position: fixed; top: 0; left: 0; width: 100%; height: 46px; display: flex;
            justify-content: space-between; align-items: center; padding: 0 6px; box-sizing: border-box;
            background-color: var(--pl-bar); z-index: 100; border-bottom: 1px solid var(--pl-line);
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.55s ease;
        }
        .top-left-group, .top-right-group { display: flex; align-items: center; gap: 2px; }
        .retro-btn {
            background: none; border: none; color: var(--pl-text); font-size: 15px; font-weight: 600;
            cursor: pointer; padding: 3px 8px; display: flex; align-items: center; justify-content: center; gap: 3px;
            min-width: 40px; min-height: 38px; border-radius: 9px; transition: background 0.15s ease;
        }
        .retro-btn:active { transform: scale(0.94); }
        .retro-btn.open { background: #33333a; }
        .retro-btn svg { display: block; }
        #btnLang { font-size: 14px; padding: 3px 8px; }
        #btnView { border: 1.5px solid #55555c; min-height: 30px; min-width: 38px; font-size: 12px; margin: 0 4px; padding: 2px 6px; }
        #pageCounter { font-size: 12px; color: var(--pl-dim); white-space: nowrap; margin-left: 4px; }
        .pv-off { opacity: 0.3; pointer-events: none; }
        /* T19: a menüsor a címlap után animálva elrejtőzik; a HELYE megmarad (a képregény nem csúszik fel) */
        body.chrome-hidden #topBar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        #chromeTab {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 64px; height: 24px; z-index: 99;
            border: 0; border-radius: 0 0 11px 11px; background: var(--pl-bar); color: var(--pl-dim);
            display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0;
        }
        body.chrome-hidden #chromeTab { display: flex; }
        /* 6. kör: az alsó sávnak is van füle (a saját, mindig foglalt sávjában – nem lóg a képbe) */
        #chromeTabBottom {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 64px; height: 22px; z-index: 99;
            border: 0; border-radius: 11px 11px 0 0; background: var(--pl-bar); color: var(--pl-dim);
            display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0;
        }
        body.chrome-hidden #chromeTabBottom { display: flex; }
        /* a két sáv helye elrejtéskor is látható, halvány határvonallal */
        #bandTop, #bandBottom { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 1; }
        #bandTop { top: 0; height: 46px; border-bottom: 1px solid var(--pl-line); }
        #bandBottom { bottom: 0; height: 48px; border-top: 1px solid var(--pl-line); }

        /* ---- lenyíló menük (nyelv, hang) ---- */
        .menu-panel {
            display: none; position: fixed; top: 50px; width: 300px; max-width: calc(100vw - 16px); box-sizing: border-box;
            background: var(--pl-panel); border: 1px solid var(--pl-line2); border-radius: 14px; padding: 4px 0 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 300; overflow-y: auto; overscroll-behavior: contain;
        }
        .menu-panel.open { display: block; }
        #langPanel { left: 8px; }
        #soundPanel { right: 8px; }
        .menu-dim { display: none; position: fixed; inset: 46px 0 0 0; background: rgba(0,0,0,0.55); z-index: 290; }
        .menu-dim.open { display: block; }
        .mp-sec { margin: 0; padding: 12px 16px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pl-dim); }
        .mp-head {
            display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 16px; border: 0;
            background: transparent; color: var(--pl-text); font-size: 15px; text-align: left; cursor: pointer; box-sizing: border-box;
        }
        .mp-head .mp-cur { margin-left: auto; color: var(--pl-accent); font-weight: 600; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mp-head .mp-chev { flex: none; color: var(--pl-dim); transition: transform 0.2s ease; }
        .mp-group.expanded .mp-chev { transform: rotate(90deg); }
        .mp-list { display: none; }
        .mp-group.expanded .mp-list { display: block; }
        .mp-group.static .mp-head { display: none; }
        .mp-group.static .mp-list { display: block; }
        .mp-opt {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 16px; border: 0;
            background: transparent; color: var(--pl-text); font-size: 15px; text-align: left; cursor: pointer; box-sizing: border-box;
        }
        .mp-opt:hover { background: rgba(255,255,255,0.04); }
        .mp-dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #6d6d75; box-sizing: border-box; }
        .mp-opt.on .mp-dot { border: 5px solid var(--pl-accent); }
        .mp-opt .mp-sub { margin-left: auto; font-size: 12px; color: var(--pl-dim); }
        .mp-note { margin: 2px 16px 6px; font-size: 12px; line-height: 1.4; color: var(--pl-dim); }
        .mp-hr { height: 1px; background: #33333a; margin: 6px 0; }
        .mp-search { display: block; width: calc(100% - 32px); margin: 4px 16px 6px; padding: 8px 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--pl-line2); background: #18181b; color: var(--pl-text); font-size: 14px; }
        .snd-row {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; border: 0;
            background: transparent; color: var(--pl-text); font-size: 15px; text-align: left; cursor: pointer; box-sizing: border-box;
        }
        .snd-row small { display: block; font-size: 12px; color: var(--pl-dim); margin-top: 2px; }
        .snd-sw { margin-left: auto; flex: none; width: 44px; height: 26px; border-radius: 13px; background: #4a4a52; position: relative; transition: background 0.2s; }
        .snd-sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #f1f1f1; transition: left 0.2s, background 0.2s; }
        .snd-row.on .snd-sw { background: var(--pl-accent); }
        .snd-row.on .snd-sw::after { left: 21px; background: var(--pl-bar); }

        /* ---- nézet ---- */
        #canvasViewport {
            position: relative; overflow-x: hidden !important; overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch; display: flex; align-items: flex-start; justify-content: flex-start;
            box-sizing: border-box; width: 100%; flex-grow: 1; background-color: transparent;
            margin-top: 54px; margin-bottom: 48px;   /* 6. kör: a felső (46 px + 8 px térköz) és az alsó sáv (48 px) helye MINDIG foglalt */
        }
        #appBg:not(.has-bg-portrait):not(.has-bg-landscape) #canvasViewport { background-color: #000; }
        #comicImage {
            position: absolute; display: block; top: 0; left: 0; transform-origin: 0 0;
            opacity: 1; transition: transform 0.1s linear; will-change: transform;
        }
        #focusHighlight {
            position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
            border: 2px solid var(--pl-accent); pointer-events: none; z-index: 10; display: none; border-radius: 4px;
        }

        /* ---- feliratsáv (F13/F19/F20/T23) ---- */
        #subtitleBar {
            position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
            padding: 10px 18px; background: rgba(15,15,16,0.92); color: var(--pl-text);
            font-family: var(--pl-theme-font); line-height: 1.4; text-align: center; z-index: 140;
            border-top: 1px solid var(--pl-line2); display: none; max-height: 40%; overflow-y: auto;
            white-space: pre-line; overflow-wrap: anywhere;   /* T23: a szerző sortörései (Enter) megmaradnak */
        }
        #subtitleBar.txt-size-small { font-size: 15px; }
        #subtitleBar.txt-size-medium { font-size: 19px; }
        #subtitleBar.txt-size-large { font-size: 23px; }
        #subtitleBar.txt-size-xl { font-size: 30px; }    /* 6. kör: 5 fokozat (nagy képernyő, TV) */
        #subtitleBar.txt-size-xxl { font-size: 38px; }
        .sz-grid button { padding: 8px 0; line-height: 1; }
        .sz-grid button span { display: inline-block; font-weight: 700; }
        #subtitleBar.cap-under { border-top: 0; border-radius: 0 0 8px 8px; }
        .video-zone { position: absolute; top: 0; width: 25%; height: calc(100% - 64px); z-index: 20; display: none; }
        #vzLeft { left: 0; } #vzRight { right: 0; }

        /* ---- alsó sáv (T3 kisebb betű, T6 A+ középen) ---- */
        #bottomBar {
            position: fixed; bottom: -60px; left: 0; width: 100%; height: 48px; display: flex;
            justify-content: space-between; align-items: center; padding: 0 8px; box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box; background-color: var(--pl-bar); border-top: 1px solid var(--pl-line); z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.25, 1, 0.5, 1); gap: 8px;
        }
        #bottomBar.visible { bottom: 0px; }
        #bottomBar .retro-btn { font-size: 13px; font-weight: 500; color: #c8c8ce; }
        #btnTxtZoom { border: 1px solid var(--pl-line2); min-height: 32px; font-size: 13px; color: var(--pl-text); gap: 6px; padding: 2px 10px; }
        #btnTxtZoom .dots { display: flex; gap: 3px; }
        #btnTxtZoom .dots i { width: 5px; height: 5px; border-radius: 50%; background: #55555c; display: block; }
        #btnTxtZoom .dots i.on { background: var(--pl-accent); }

        /* ---- felugró ablakok (☰ Beállítások) ---- */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 400; display: none; justify-content: center; align-items: center;
        }
        .popup-window {
            background: var(--pl-panel); border: 1px solid var(--pl-line2); border-radius: 14px; box-sizing: border-box;
            padding: 18px; width: 88%; max-width: 340px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .popup-title { color: var(--pl-text); font-size: 18px; font-weight: 700; margin-bottom: 14px; text-align: center; }
        .popup-row { margin-bottom: 14px; }
        .popup-label { color: var(--pl-dim); font-size: 13px; margin-bottom: 5px; }
        .btn-grid { display: flex; gap: 5px; width: 100%; }
        .btn-grid button, .popup-close {
            flex: 1; background: #2c2c31; border: 1px solid var(--pl-line2); color: var(--pl-text);
            padding: 10px; font-size: 14px; cursor: pointer; border-radius: 8px; font-weight: 600;
        }
        .btn-grid button.active { background: var(--pl-accent); border-color: var(--pl-accent); color: var(--pl-on-accent); }
        .popup-close { width: 100%; margin-top: 6px; }
        .popup-primary { background: var(--pl-accent) !important; color: var(--pl-on-accent) !important; border-color: var(--pl-accent) !important; }

        /* ---- videó (T2/T12/T13) ---- */
        #pageVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; background: #000; display: none;
        }
        #pageVideo::-webkit-media-controls,
        #pageVideo::-webkit-media-controls-overlay-play-button,
        #pageVideo::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
        #pageVideo.vid-wait { visibility: hidden; }
        #videoCtl {
            position: absolute; display: none; align-items: center; gap: 6px; height: 44px; padding: 0 8px;
            box-sizing: border-box; background: rgba(10, 11, 14, 0.62); z-index: 25; transition: opacity 0.3s ease;
        }
        #videoCtl.hidden { opacity: 0; pointer-events: none; }
        .vc-btn {
            flex: none; width: 38px; height: 38px; border: 0; padding: 0; background: none; color: var(--pl-text);
            display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px;
        }
        .vc-btn:active { background: rgba(255,255,255,0.12); }
        #vcTrack { flex: 1; height: 38px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
        #vcBar { position: relative; width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.28); overflow: hidden; }
        #vcFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--pl-accent); }

        /* ---- záróoldal ---- */
        #creditsPage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center; text-align: center; overflow-y: auto;
            background: rgba(15,15,16,0.94); color: var(--pl-text); padding: 30px; box-sizing: border-box;
        }
        #creditsPage .credits-title { font-family: var(--pl-theme-font); font-size: 26px; font-weight: bold; color: var(--pl-accent); margin-bottom: 8px; }
        #creditsPage .credits-author { font-size: 16px; color: var(--pl-dim); margin-bottom: 34px; }
        #creditsPage .credits-text { font-size: 15px; font-style: italic; color: #d8d8dc; }
        #creditsPage > div { margin: auto; max-width: 560px; }
        #creditsPage .credits-brand { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--pl-line2); }
        #creditsPage .credits-brand-name { font-size: 22px; font-weight: bold; color: var(--pl-accent); }
        #creditsPage .credits-tagline { font-size: 14px; font-style: italic; color: var(--pl-dim); margin: 4px 0 14px; }
        #creditsPage .credits-features { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.7; color: #d8d8dc; }

        /* ---- bemutatóoldal (T15) és kiadvány adatai (T24): közös elrendezés ---- */
        #introPage, #metaPage { position: absolute; inset: 0; display: none; color: var(--pl-text); box-sizing: border-box; overflow: hidden; }
        #introPage { background: rgba(15,15,16,0.9); }
        #metaPage { position: fixed; top: 46px; z-index: 250; background: #0f0f10; overflow-y: auto; }
        .ip-edge {
            position: absolute; top: 0; bottom: 0; width: 30px; display: flex; align-items: center; justify-content: center;
            background: rgba(20,20,22,0.85); color: var(--pl-dim); font-size: 11px; font-weight: 700; letter-spacing: .18em; z-index: 2;
        }
        .ip-edge span { writing-mode: vertical-rl; white-space: nowrap; }
        .ip-edge.left { left: 0; } .ip-edge.left span { transform: rotate(180deg); }
        .ip-edge.right { right: 0; }
        .ip-main { position: absolute; top: 0; bottom: 0; left: 30px; right: 30px; overflow-y: auto; display: flex; justify-content: center; }
        #metaPage .ip-main { left: 0; right: 0; position: relative; min-height: 100%; }
        .ip-wrap { width: 100%; max-width: 980px; box-sizing: border-box; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
        /* 6. kör: telefonon a cím a borító FÖLÖTT (mellette nem fért ki); a borító mellett csak az oldalszám/MB */
        .ip-head { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "t t" "a a" "c s"; gap: 4px 14px; align-items: end; }
        .ip-titles { display: contents; }
        .ip-title { grid-area: t; }
        .ip-author { grid-area: a; }
        .ip-small { grid-area: s; align-self: end; }
        .ip-cover { grid-area: c; margin-top: 8px; flex: none; width: 92px; max-height: 140px; object-fit: contain; background: #2a2a2f; box-shadow: 0 8px 22px rgba(0,0,0,0.5); }
        .ip-title { margin: 0; font-family: var(--pl-theme-font); font-size: 19px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
        .ip-author { margin: 0; font-size: 12.5px; color: var(--pl-dim); }
        .ip-small { margin: 0; font-size: 12px; color: var(--pl-dim); }
        .ip-h2 { margin: 2px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pl-dim); }
        .ip-list { display: flex; flex-direction: column; }
        .ip-li { display: flex; align-items: center; gap: 12px; margin: 0; padding: 6px 0; font-size: 13px; line-height: 1.35; color: #e4e4e8; border-bottom: 1px solid #222226; }
        .ip-li:last-child { border-bottom: 0; }
        .ip-k { flex: none; min-width: 46px; height: 32px; padding: 0 6px; border-radius: 8px; background: var(--pl-bar); border: 1px solid #33333a; display: flex; align-items: center; justify-content: center; color: var(--pl-text); font-size: 12px; font-weight: 600; box-sizing: border-box; }
        .ip-start { height: 48px; border: 0; border-radius: 12px; background: var(--pl-accent); color: var(--pl-on-accent); font-size: 16px; font-weight: 700; cursor: pointer; padding: 0 36px; }
        .ip-note { font-size: 12px; color: var(--pl-dim); text-align: center; }
        .ip-dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
        .ip-dl dt { color: var(--pl-dim); }
        .ip-dl dd { margin: 0; color: var(--pl-text); overflow-wrap: anywhere; }
        @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
            .ip-wrap { display: grid; grid-template-columns: minmax(200px, 360px) minmax(0, 1fr); gap: 20px 56px; align-content: center; padding: 24px 32px; min-height: 100%; }
            .ip-head { display: contents; }
            .ip-cover { grid-area: auto; grid-column: 1; grid-row: 1 / span 6; width: 100%; max-height: 72vh; align-self: center; }
            .ip-titles { display: flex; flex-direction: column; gap: 8px; }
            .ip-cover { margin-top: 0; }
            .ip-title { font-size: 30px; }
            .ip-author, .ip-small { font-size: 14px; }
            .ip-small { align-self: auto; }
            .ip-li { font-size: 14px; padding: 8px 0; }
            .ip-start { justify-self: start; }
            .ip-edge { width: 46px; font-size: 12px; }
            .ip-main { left: 46px; right: 46px; }
        }
        #turnLayer { position: absolute; inset: 0; display: none; z-index: 15; perspective: 1400px; pointer-events: none; overflow: hidden; }
        .turn-page { position: absolute; transform-origin: left center; transform-style: preserve-3d; }
        .turn-page > .tp-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.6); overflow: hidden; }
        .turn-page > .tp-back { transform: rotateY(180deg); background: linear-gradient(90deg, #cfc9bc, #ece7dc 60%, #d9d3c6); }
        .turn-page.tp-slide { transform-style: flat; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        #loadError { color: var(--pl-text); padding: 30px; font-size: 16px; display: none; }
        [dir="rtl"] .ip-li, [dir="rtl"] .mp-opt, [dir="rtl"] .mp-head, [dir="rtl"] .snd-row { text-align: right; }
    </style>
</head>

<body>

    <div id="appBg">
        <div id="topBar">
            <div class="top-left-group">
                <button id="btnLang" class="retro-btn" data-pl-title="plLangTitle" aria-haspopup="true">EN
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <span id="pageCounter"></span>
            </div>
            <div class="top-right-group">

    <audio id="bgAudioPlayer"></audio>
    <!-- 37. TÉTEL: a projekt-szintű aláfestő zene, külön a blokk/oldal-hangoktól.
         Folyamatosan, végtelenítve szól a teljes kiadvány alatt. -->
    <audio id="bgMusicPlayer" loop></audio>

    <!-- Az export adata: window.MAGAZINE_DATA (így file://-ről is megnyitható) -->
    <script src="data.js"></script>

    <script>
        // === JAVASCRIPT INDÍTÁS: ÁLLAPOTOK ÉS SZÓTÁRAK ===
        let activeMagazineData = null;
        let currentAudioKey = "";
        let lastTouchAt = 0;
        let pageIdx = 0;
        let blockIdx = -1;
        let subWindowIdx = 0;

        let currentLang = "en";   // a PLAYER kezelőfelület-nyelve (kisbetűs kód) - a szerző által az exportnál megadott nyelvek egyike
        // T14 (2026-10-13): a nyelvmenü három része – Menü nyelve | Felirat | Felolvasás.
        //   subsLang: "none" (nincs felirat) | "ORIG" (eredeti) | fordítás kódja  – a felirat a választással KAPCSOL BE
        //   ttsLang:  "off" | "ORIG" | fordítás kódja                              – gépi felolvasás külön nyelvvel
        // A 🔊 hangmenü: háttérzene (musicOn) és felvett blokkhangok/effektek (blockSoundOn) – a felolvasásra NEM vonatkozik.
        let subsLang = "none";
        let ttsLang = "off";
        let lastSubsLang = "ORIG";   // a "T" billentyű ehhez vált vissza
        let introActive = false;  // F23: a bemutatóoldal (a címlap előtt) látszik-e
        let configTxtSize = "small";
        let configSpeed = 0.8;
        let configVoiceGender = "female";
        let configBarFixed = false;   // "Menüsorok rögzítése": ilyenkor nem rejtőzik el a felső és az alsó sáv
        const subsActive = () => subsLang !== "none";

        const audioPlayer = document.getElementById("bgAudioPlayer");
        const bgMusicPlayer = document.getElementById("bgMusicPlayer");

        // ⭐ 2. ÜTEM - HÁTTÉRZENE-SZERKESZTŐ: több, oldaltartományhoz rendelt sáv (data.js "backgroundTracks");
        // lapozáskor a megfelelő sávra váltunk. A zene indítása csak felhasználói gesztusra megbízható.
        let currentBgTrackId = null;
        let bgMusicUnlockRegistered = false;

        function resolveBgTrackForPage(pageNum) {
            const tracks = (activeMagazineData && activeMagazineData.backgroundTracks) || [];
            // Átfedő tartományoknál a LISTÁBAN HÁTRÉBB lévő sáv nyer.
            let found = null;
            for (const t of tracks) {
                const start = t.startPage || 1;
                const end = (t.endPage === null || t.endPage === undefined) ? Infinity : t.endPage;
                if (pageNum >= start && pageNum <= end) found = t;
            }
            return found;
        }

        // F18/P1: musicMode "pages" (oldaltartományhoz kötött sávok) vagy "playlist" (minden sáv egymás után, végtelenítve).
        let musicOn = true;
        let blockSoundOn = true;
        let playlistIdx = 0;
        function playerStart() { return (activeMagazineData && activeMagazineData.meta && activeMagazineData.meta.playerStart) || {}; }
        function musicMode() { return playerStart().musicMode === "playlist" ? "playlist" : "pages"; }
        function bgTryPlay() { if (musicOn && gvMode && !introActive && bgMusicPlayer.src) { const p = bgMusicPlayer.play(); if (p && p.catch) p.catch(() => {}); } }
        function unlockAudioFromGesture() { bgTryPlay(); }
        function registerMusicUnlock() {
            if (bgMusicUnlockRegistered) return;
            bgMusicUnlockRegistered = true;
            const unlock = () => {
                bgTryPlay();
                if (!bgMusicPlayer.paused) ["pointerdown", "touchend", "click", "keydown"].forEach(ev => document.removeEventListener(ev, unlock, true));
            };
            ["pointerdown", "touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, unlock, true));
        }

        // F17: a háttérzene hangereje. Alap 100%; ahol felvett hang szól, vagy a gépi felolvasás
        // egy szöveges blokkot olvas, 40%. A szerző blokkonként (és oldalanként) kézzel felülírhatja
        // (0–100, húszasával). A váltás lágy átúszással történik. (iPhone-on a böngésző nem engedi
        // a hangerő állítását – ott a zene mindig teljes hangerővel szól.)
        let musicTarget = 1, musicFadeRaf = 0;
        function setMusicTarget(v) {
            v = Math.max(0, Math.min(1, v));
            if (Math.abs(v - musicTarget) < 0.001 && !musicFadeRaf) return;
            musicTarget = v;
            cancelAnimationFrame(musicFadeRaf);
            const from = bgMusicPlayer.volume, t0 = performance.now(), dur = 600;
            const step = (t) => {
                const k = Math.min(1, (t - t0) / dur);
                try { bgMusicPlayer.volume = from + (musicTarget - from) * k; } catch (_) {}
                musicFadeRaf = k < 1 ? requestAnimationFrame(step) : 0;
            };
            musicFadeRaf = requestAnimationFrame(step);
        }

        function updateBackgroundMusicForPage(pageNum) {
            const tracks = (activeMagazineData && activeMagazineData.backgroundTracks) || [];
            if (musicMode() === "playlist") {
                if (!tracks.length || currentBgTrackId !== null) return; // a lista egyszer indul, utána magától halad
                currentBgTrackId = "playlist";
                playlistIdx = 0;
                bgMusicPlayer.loop = tracks.length === 1;
                bgMusicPlayer.src = tracks[0].audioPath;
                bgMusicPlayer.onended = () => {
                    playlistIdx = (playlistIdx + 1) % tracks.length;
                    bgMusicPlayer.src = tracks[playlistIdx].audioPath;
                    bgTryPlay();
                };
                bgTryPlay(); registerMusicUnlock();
                return;
            }
            bgMusicPlayer.loop = true;
            bgMusicPlayer.onended = null;
            const track = resolveBgTrackForPage(pageNum);
            if (!track) {
                if (currentBgTrackId !== null) { bgMusicPlayer.pause(); currentBgTrackId = null; }
                return;
            }
            if (track.id === currentBgTrackId) return; // ugyanaz a sáv szól tovább - nem indítjuk újra
            currentBgTrackId = track.id;
            bgMusicPlayer.src = track.audioPath;
            bgTryPlay(); registerMusicUnlock();
        }

        function setMusicOn(on) {
            musicOn = on;
            if (on) bgTryPlay(); else bgMusicPlayer.pause();
            updateSoundButton();
        }
        function setBlockSoundOn(on) {
            blockSoundOn = on;
            if (!on) { audioPlayer.pause(); currentAudioKey = ""; }
            updateSoundButton();
            resizeLayout();
        }

        // ELSO RESZ VEGE

                // === JAVASCRIPT 2. RÉSZ: NYELVI SZÓTÁR ÉS INTERFÉSZ FRISSÍTÉS ===
        // 2.3.0: a player szövegei a data.js "playerUi" mezőjéből jönnek (a szerkesztő nyelvi csomagjainak
        // "pl..." kulcsai) - az exportnál a szerző megadja, mely nyelveken legyen elérhető a player.
        function pt(key) {
            const ui = (activeMagazineData && activeMagazineData.playerUi) || {};
            const L = ui.languages || {};
            const pick = (c) => (L[c] && L[c][key] !== undefined && L[c][key] !== "") ? L[c][key] : undefined;
            const v = pick(currentLang);
            if (v !== undefined) return v;
            const d = pick(ui.default); if (d !== undefined) return d;
            const e = pick("en"); if (e !== undefined) return e;
            return key;
        }
        // A felolvasás/szövegtartalom alapnyelve: a kiadvány eredeti nyelve (NEM a player felületének nyelve).
        function baseLang() { return (activeMagazineData && activeMagazineData.lang) || "en"; }

        // F30: a záróoldal szövegei a player nyelvén.
        function renderCredits() {
            const made = document.getElementById("creditsText");
            if (made) made.textContent = pt("plCreditsMade");
            const tag = document.getElementById("creditsTagline");
            if (tag) tag.textContent = pt("plCreditsTagline");
            const list = document.getElementById("creditsFeatures");
            if (list) {
                list.innerHTML = "";
                for (let i = 1; i <= 6; i++) { const li = document.createElement("li"); li.textContent = pt("plCredits" + i); list.appendChild(li); }
            }
        }

        function playerLangCodes() {
            const ui = activeMagazineData && activeMagazineData.playerUi;
            return (ui && ui.languages) ? Object.keys(ui.languages) : [];
        }
        // A nyelv neve a SAJÁT nyelvén (endonim), pl. "Deutsch", "日本語" – a sok nyelvű listában így találja meg az olvasó.
        function endonym(code) {
            const ui = activeMagazineData && activeMagazineData.playerUi;
            const n = ui && ui.languages && ui.languages[code] && ui.languages[code].plLangName;
            if (n) return n;
            try { const dn = new Intl.DisplayNames([code], { type: "language" }).of(code); if (dn && dn.toLowerCase() !== code.toLowerCase()) return dn.charAt(0).toUpperCase() + dn.slice(1); } catch (_) {}
            try { const dn = new Intl.DisplayNames([currentLang || "en"], { type: "language" }).of(code); if (dn) return dn.charAt(0).toUpperCase() + dn.slice(1); } catch (_) {}
            return String(code).toUpperCase();
        }
        function playerLangName(code) { return endonym(code); }
        function translationCodes() { return Object.keys((activeMagazineData && activeMagazineData.translations) || {}); }
        function contentLangLabel(v) { return v === "ORIG" ? endonym(baseLang()) : endonym(v); }
        function rtlLangs() { return (activeMagazineData && activeMagazineData.rtlLangs) || ["ar", "he", "fa", "ur", "ps", "sd", "ug", "yi", "dv", "ckb"]; }
        function isRtl(code) { const c = String(code || "").toLowerCase(); return rtlLangs().some(r => c === r || c.split("-")[0] === r); }
        function realSubsLang() { return subsLang === "ORIG" ? baseLang() : subsLang; }

        function updateUiLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = isRtl(currentLang) ? "rtl" : "ltr";
            document.querySelectorAll("[data-pl]").forEach(el => { el.textContent = pt(el.getAttribute("data-pl")); });
            document.querySelectorAll("[data-pl-title]").forEach(el => { el.title = pt(el.getAttribute("data-pl-title")); el.setAttribute("aria-label", el.title); });
            document.querySelectorAll("[data-pl-alt]").forEach(el => { el.alt = pt(el.getAttribute("data-pl-alt")); });
            const lb = document.getElementById("btnLang");
            if (lb && lb.firstChild) lb.firstChild.nodeValue = String(currentLang).toUpperCase().split("-")[0] + " ";

            const vBtn = document.getElementById("btnVoiceToggle");
            vBtn.innerText = vBtn.getAttribute("disabled") ? pt("plNoVoice") : ((configVoiceGender === "female") ? pt("plFemale") : pt("plMale"));
            document.getElementById("btnBarToggle").innerText = configBarFixed ? pt("plOn") : pt("plOff");
            const tfx = document.getElementById("btnTurnFx");
            if (tfx) tfx.innerText = turnFxEnabled() ? pt("plOn") : pt("plOff");
            // a felolvasás beállításai csak akkor látszanak, ha van gépi felolvasás
            const ttsPossible = ttsChoices().length > 0;
            document.getElementById("rowSpeed").style.display = ttsPossible ? "" : "none";
            document.getElementById("rowVoice").style.display = ttsPossible ? "" : "none";
            renderCredits();
            updateSoundButton();
            updateTxtZoomButton();
            if (introActive && activeMagazineData) renderIntro();
            if (document.getElementById("langPanel").classList.contains("open")) buildLangPanel();
            if (document.getElementById("metaPage").style.display === "block") renderMetaPage();
        }

        // A böngészőnek van-e hangja ehhez a nyelvhez (nélküle nincs gépi felolvasás ezen a nyelven).
        function hasVoiceFor(lang) {
            if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return false;
            const prim = String(lang || "").toLowerCase().split(/[-_]/)[0];
            return window.speechSynthesis.getVoices().some(v => String(v.lang).toLowerCase().split(/[-_]/)[0] === prim);
        }
        function hasRecordedAudio() {
            return ((activeMagazineData && activeMagazineData.pages) || []).some(pg => pg.audioPath || (pg.elements || []).some(e => e.audioPath));
        }
        function hasMusic() { return ((activeMagazineData && activeMagazineData.backgroundTracks) || []).length > 0; }
        // A felolvasás választható nyelvei: az eredeti + a fordítások közül, amelyekhez a készüléken van hang.
        function ttsChoices() {
            if (!activeMagazineData) return [];
            const out = [];
            if (hasVoiceFor(baseLang())) out.push("ORIG");
            for (const c of translationCodes()) if (hasVoiceFor(c)) out.push(c);
            return out;
        }

        // ---- 🔊 hangmenü: Minden ki | Háttérzene | Blokkhangok (a gépi felolvasás a nyelvmenüben van) ----
        const SND_ICONS = {
            on: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
            part: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13" stroke="#6d6d75" stroke-dasharray="2 3"/></svg>',

        // ---- T14/T26 nyelvmenü: lenyitáskor a szakaszok (minek a nyelvét állítjuk); ha minden kifér,

        let langOpenSection = null;   // nem kifér-módban a nyitott szakasz
        function langSections() {
            const secs = [];

            const subs = [{ v: "none", label: pt("plNoSubs") }, { v: "ORIG", label: endonym(baseLang()), sub: pt("plOriginalShort") }, ...translationCodes().map(c => ({ v: c, label: endonym(c) }))];
            secs.push({ id: "subs", title: pt("plLangSubs"), cur: subsLang, items: subs, pick: setSubsLang, fixedTop: 2 });
            const tts = ttsChoices();

        // sok nyelvnél: a választott és a böngésző nyelve legfelül, a többi ábécérendben (endonim szerint)
        function orderItems(sec) {
            const top = sec.items.slice(0, sec.fixedTop || 0), rest = sec.items.slice(sec.fixedTop || 0);
            if (rest.length <= 6) return [...top, ...rest];
            const nav = (navigator.languages || [navigator.language || ""]).map(l => String(l).toLowerCase().split("-")[0]);
            const pri = (it) => it.v === sec.cur ? 0 : (nav.includes(String(it.v).toLowerCase().split("-")[0]) ? 1 : 2);
            rest.sort((a, b) => (pri(a) - pri(b)) || a.label.localeCompare(b.label));
            return [...top, ...rest];
        }
        function buildLangPanel() {
            const panel = document.getElementById("langPanel");

            const render = (mode) => {   // mode: "all" (minden kinyitva) | "accordion"

                    const list = document.createElement("div"); list.className = "mp-list";

                    let search = null;

                        b.onclick = () => { sec.pick(it.v); buildLangPanel(); };
                        list.appendChild(b); btns.push([b, it.label.toLowerCase() + " " + String(it.v).toLowerCase()]);

        // ---- T19: a menüsorok (felső + alsó) a címlap megjelenítése alatt animálva elrejtőznek; a helyük
        //      megmarad. A fül (vagy alulról felfelé húzás) visszahozza őket egy időre. A bemutatóoldalon
        //      mindig látszanak. A "Menüsorok rögzítése" beállítás kikapcsolja az elrejtést. ----
        let chromeTimer = null;
        function chromeShouldStay() { return configBarFixed || introActive || menuOpen() || document.getElementById("popSettings").style.display === "flex" || document.getElementById("metaPage").style.display === "block" || document.getElementById("popOffline").style.display === "flex"; }
        function showChrome(stay) {

            if (!stay) scheduleChromeHide(4000);

        }
        function scheduleChromeHide(ms) { clearTimeout(chromeTimer); chromeTimer = setTimeout(hideChrome, ms); }
        function applyChromeFixed() {
            if (configBarFixed || introActive) { clearTimeout(chromeTimer); document.body.classList.remove("chrome-hidden"); document.getElementById("bottomBar").classList.add("visible"); }
        }

        // ---- T6: A+ (felirat nagyítása, 3 méret) az alsó sávban; csak ha van felirat ----
        function updateTxtZoomButton() {
            const b = document.getElementById("btnTxtZoom");

        function checkVoiceAvailability(targetLang) {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            const lowerLang = String(targetLang || "").toLowerCase();
            const hasGender = voices.some(v => {
                const l = v.lang.toLowerCase();
                if (!l.startsWith(lowerLang) && !lowerLang.startsWith(l)) return false;
                const n = v.name.toLowerCase();
                return configVoiceGender === "male" ? (n.includes("male") || n.includes("szabolcs") || n.includes("david")) : (n.includes("female") || n.includes("tünde") || n.includes("zsuzsa"));
            });
            const vBtn = document.getElementById("btnVoiceToggle");
            if (!hasGender && voices.length > 0) { vBtn.setAttribute("disabled", "true"); vBtn.style.opacity = "0.5"; }
            else { vBtn.removeAttribute("disabled"); vBtn.style.opacity = "1"; }
            updateUiLanguage();
        }

        // JAVASCRIPT OREKOS FORRAS 2 RESZ VEGE

                // === JAVASCRIPT 3. RÉSZ: ELRENDEZÉS ÉS AUDIÓ HIERARCHIA MŰKÖDTETÉSE ===
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {

        function resetImageStyles() {

        const TOP_BAND = 54, BOTTOM_BAND = 48;   // felső sáv 46 px + 8 px térköz; alsó sáv 48 px
        function resizeLayout() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const viewport = document.getElementById("canvasViewport");
            // 6. kör (user, 2026-10-14): a felső és az alsó sáv helye mindig foglalt, a kép sosem csúszik alájuk
            const viewHeight = Math.max(120, screenH - TOP_BAND - BOTTOM_BAND);
            if (viewport) viewport.style.height = viewHeight + "px";
            applyChromeFixed();
            applyGuidedViewLogic((viewport && viewport.clientWidth) || screenW, (viewport && viewport.clientHeight) || viewHeight);

        // ⭐ FORDÍTÁSI RENDSZER - 2. réteg: "oldalID" / "oldalID:blokkID" kulcs (ugyanaz, mint lib/blockKeys.js).
        function contentKeyFor(pageId, blockId) {
            return (blockId === undefined || blockId === null || blockId === "") ? String(pageId) : `${pageId}:${blockId}`;
        }
        // A megadott nyelven ("ORIG" = eredeti, vagy fordítás kódja) adja vissza a szöveget; ha nincs fordítás, az eredetit.
        function translatedText(pageId, blockId, original, lang) {
            if (!lang || lang === "ORIG" || lang === "none" || lang === "off" || !activeMagazineData) return original;
            const table = activeMagazineData.translations && activeMagazineData.translations[lang];
            if (!table) return original;
            const t = table[contentKeyFor(pageId, blockId)];
            return (typeof t === "string" && t.trim() !== "") ? t : original;
        }

        // F20 + F11: a felirat a kép ALATT van, ha a kép és a felirat együtt elfér; ha nem, a szerző blokkonként
        // beállított helyére kerül (alul / középen / felül). A vezérlést (menüsorok, videó-sáv) SOHA nem takarja.
        let captionPos = "bottom";
        function positionSubtitleBar() {
            const bar = document.getElementById("subtitleBar");
            const bBar = document.getElementById("bottomBar");
            const vp = document.getElementById("canvasViewport");
            if (!bar || !bBar || !vp) return;
            const vz = currentPageType() === "video" ? "block" : "none";
            const zl = document.getElementById("vzLeft"), zr = document.getElementById("vzRight");
            if (zl) zl.style.display = vz;
            if (zr) zr.style.display = vz;
            if (bar.style.display === "none") return;
            const topLimit = 46;   // a felső sor helye mindig foglalt (T19)
            let bottomLimit = window.innerHeight - BOTTOM_BAND;   // az alsó sáv helye mindig foglalt
            // a média alsó széle a képernyőn
            let mediaBottom = null;
            if (currentPageType() === "video") {
                const v = document.getElementById("pageVideo");
                const r = v.getBoundingClientRect();
                mediaBottom = r.bottom;
                if (r.bottom > bottomLimit - 50) bottomLimit = Math.min(bottomLimit, r.bottom - 44);   // a videó saját sávja fölé
            } else if (currentPageType() === "image" && (blockIdx === -1 || !gvMode)) {
                const vr = vp.getBoundingClientRect();
                mediaBottom = vr.top + lastFullRect.y + lastFullRect.h;
            }
            bar.style.top = "auto"; bar.style.bottom = "auto";
            bar.classList.remove("cap-under");
            const h = bar.offsetHeight;
            if (mediaBottom !== null && mediaBottom + h <= bottomLimit && mediaBottom >= topLimit) {
                bar.style.top = Math.round(mediaBottom) + "px";
                bar.classList.add("cap-under");
                return;
            }
            if (captionPos === "top") bar.style.top = topLimit + "px";
            else if (captionPos === "middle") bar.style.top = Math.max(topLimit, Math.round((topLimit + bottomLimit - h) / 2)) + "px";
            else bar.style.bottom = (window.innerHeight - bottomLimit) + "px";
        }
        (function watchBottomBar() {
            const bBar = document.getElementById("bottomBar");
            if (bBar && window.MutationObserver) new MutationObserver(() => setTimeout(positionSubtitleBar, 420)).observe(bBar, { attributes: true, attributeFilter: ["class"] });
        })();

        // F28: GV = Guided View (blokkvezetés + hang + felirat + zene), PV = Page View (szabad oldalnézet, "pure" olvasás).
        let gvMode = true;
        let pendingForward = false;     // az oldalra ELŐRE léptünk: a kezdő blokk a kép betöltése után dől el
        let viewScale = 1, viewTx = 0, viewTy = 0;   // PV: nagyítás és eltolás
        let pvBase = { ix: 0, iy: 0, bs: 1, W: 0, H: 0, nw: 0, nh: 0 };
        let lastFullRect = { x: 0, y: 0, w: 0, h: 0 };
        let turning = false;
        let lastDragAt = 0, lastPointX = 0, lastPointY = 0;

        function pageNaturalSize(i) {
            const pg = activeMagazineData.pages[i];
            const cur = document.getElementById("comicImage");
            if (i === pageIdx && cur && cur.naturalWidth) return [cur.naturalWidth, cur.naturalHeight];
            const im = pg && preloadCache.get(pg.imagePath);
            return (im && im.naturalWidth) ? [im.naturalWidth, im.naturalHeight] : [0, 0];
        }
        function pageCoverage(i) {
            const els = (activeMagazineData.pages[i].elements) || [];
            const [W, H] = pageNaturalSize(i);
            if (!W || !els.length) return 0;
            const xs = Array.from(new Set(els.flatMap(e => [Math.max(0, e.x1), Math.min(W, e.x2)]))).sort((a, b) => a - b);
            let area = 0;
            for (let k = 0; k < xs.length - 1; k++) {
                const xa = xs[k], xb = xs[k + 1]; if (xb <= xa) continue;
                const iv = els.filter(e => e.x1 <= xa && e.x2 >= xb).map(e => [Math.max(0, e.y1), Math.min(H, e.y2)]).sort((a, b) => a[0] - b[0]);
                let cur = null, len = 0;
                for (const [a, b] of iv) { if (b <= a) continue; if (!cur) cur = [a, b]; else if (a <= cur[1]) cur[1] = Math.max(cur[1], b); else { len += cur[1] - cur[0]; cur = [a, b]; } }
                if (cur) len += cur[1] - cur[0];
                area += len * (xb - xa);
            }
            return area / (W * H);
        }
        // Az oldal a TELJES oldallal kezdődik-e (Full page), vagy rögtön az első blokkal (Guided).
        function startsFull(i) {
            const pg = activeMagazineData.pages[i];
            if (!pg || !(pg.elements || []).length || pg.type === "video" || pg.type === "credits") return true;
            if (pg.viewStart === "full") return true;
            if (pg.viewStart === "guided") return false;
            return pageCoverage(i) < 0.7;
        }
        function minBlockIdx() { return (!gvMode || startsFull(pageIdx)) ? -1 : 0; }

        function setViewMode(mode, remember) {
            gvMode = (mode !== "PV");
            if (remember) { try { localStorage.setItem("zcfx.viewMode", gvMode ? "GV" : "PV"); } catch (_) {} }
            viewScale = 1; viewTx = 0; viewTy = 0;
            blockIdx = gvMode ? minBlockIdx() : -1;
            document.getElementById("btnView").textContent = gvMode ? "GV" : "PV";
            document.getElementById("btnSound").classList.toggle("pv-off", !gvMode);
            if (!gvMode) { bgMusicPlayer.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel(); audioPlayer.pause(); currentAudioKey = ""; }
            else bgTryPlay();
            resizeLayout();
        }

        // PV: nagyítás az (cx,cy) viewport-pont körül
        function pvZoomAt(cx, cy, factor) {
            const sOld = viewScale;
            const sNew = Math.min(5, Math.max(1, sOld * factor));
            if (sNew === sOld) return;
            const tx = pvBase.ix + viewTx, ty = pvBase.iy + viewTy;
            const ntx = cx - (cx - tx) * (sNew / sOld), nty = cy - (cy - ty) * (sNew / sOld);
            viewScale = sNew; viewTx = ntx - pvBase.ix; viewTy = nty - pvBase.iy;
            if (viewScale === 1) { viewTx = 0; viewTy = 0; }
            resizeLayout();
        }

        const TXT_SIZES = ["small", "medium", "large", "xl", "xxl"];   // 6. kör: 5 fokozat
        function setTxtSize(sz) {
            if (!TXT_SIZES.includes(sz)) sz = "small";
            configTxtSize = sz;
            try { localStorage.setItem("zcfx.txtSize", sz); } catch (_) {}

        function renderSubtitleBar(text) {
            const bar = document.getElementById("subtitleBar");
            if (!bar) return;
            bar.className = "txt-size-" + configTxtSize;
            if (gvMode && subsActive() && text) {
                bar.textContent = text;

        // T20: a betűlánc egy adott nyelvhez – a téma betűje, a Noto Sans, majd az írásrendszerek
        // betűi úgy rendezve, hogy a nyelvhez illő legyen elöl (pl. kínai írásjelek: ja -> JP, zh-Hant -> TC).
        function fontStackFor(lang, useTheme) {
            const stack = (activeMagazineData && activeMagazineData.fontStack) || [];
            const prim = String(lang || "").toLowerCase();
            const score = (e) => (e.langs || []).some(l => l.toLowerCase() === prim) ? 2 : ((e.langs || []).some(l => l.toLowerCase() === prim.split("-")[0]) ? 1 : 0);
            const ordered = stack.map((e, i) => ({ e, i, s: score(e) })).sort((a, b) => (b.s - a.s) || (a.i - b.i)).map(x => `'${x.e.family}'`);
            const theme = (useTheme && activeMagazineData && activeMagazineData.playerTheme && activeMagazineData.playerTheme.hasFont) ? ["'ZcfxTheme'"] : [];
            return [...theme, "'Noto Sans'", ...ordered, "system-ui", "-apple-system", "'Segoe UI'", "Roboto", "Arial", "sans-serif"].join(", ");
        }

        // F17: a háttérzene célhangereje a mostani blokkon/oldalon
        function musicLevelFor(el, page, recordedPlaying, ttsPlaying) {
            const manual = (el && typeof el.musicVol === "number") ? el.musicVol : ((!el && page && typeof page.musicVol === "number") ? page.musicVol : null);
            if (manual !== null) return manual / 100;
            return (recordedPlaying || ttsPlaying) ? 0.4 : 1;
        }

        function updateTextAndAudio(currentElement) {
            // ⭐ "Page" (oldal-szintű tartalom): ha a blokknak nincs saját szövege (vagy nincs is blokk -
            // pl. videó-oldalnál), az oldal SAJÁT (page.text) szövege jelenik meg helyette.
            const currentPage = activeMagazineData.pages[pageIdx];
            const pageId = currentPage && currentPage.id;
            const blockIdForKey = (currentElement && currentElement.id !== undefined) ? currentElement.id : null;
            captionPos = (currentElement && currentElement.captionPos) || (currentPage && currentPage.captionPos) || "bottom";
            const blockTextOriginal = (currentElement && currentElement.content && currentElement.content.trim()) || "";
            const pageTextOriginal = (currentPage && currentPage.text && currentPage.text.trim()) || "";
            const blockText = blockTextOriginal ? translatedText(pageId, blockIdForKey, blockTextOriginal, subsLang) : "";
            const pageText = pageTextOriginal ? translatedText(pageId, null, pageTextOriginal, subsLang) : "";
            const wantedText = (blockText || pageText).replace(/\r\n?/g, "\n");   // T23: Windows-sortörés egységesítése
            renderSubtitleBar(wantedText);

            // 1) felvett hang (blokk vagy oldal) – a 🔊 menü "Blokkhangok" kapcsolója vezérli
            let wantedAudio = "";
            if (blockSoundOn && gvMode) wantedAudio = ((currentElement && currentElement.audioPath) || (currentPage && currentPage.audioPath) || "").trim();
            if (wantedAudio) {
                if (currentAudioKey !== wantedAudio) {
                    audioPlayer.pause();
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    audioPlayer.src = wantedAudio;
                    currentAudioKey = wantedAudio;
                    audioPlayer.play().catch(() => {});
                } else if (audioPlayer.paused && !audioPlayer.ended) {
                    audioPlayer.play().catch(() => {});
                }
                setMusicTarget(musicLevelFor(currentElement, currentPage, true, false));
                return;
            }
            audioPlayer.pause();
            currentAudioKey = "";
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            // 2) gépi felolvasás – a nyelvmenü "Felolvasás" része vezérli (ttsLang), a felirattól függetlenül
            let speaking = false;
            if (ttsLang !== "off" && gvMode && window.speechSynthesis) {
                const srcText = (currentElement ? (currentElement.content || "") : (currentPage && currentPage.type === "video" ? (currentPage.text || "") : "")).trim();
                const speechText = srcText ? translatedText(pageId, currentElement ? blockIdForKey : null, srcText, ttsLang) : "";
                const lang = ttsLang === "ORIG" ? baseLang() : ttsLang;
                if (speechText && hasVoiceFor(lang)) {
                    const utterance = new SpeechSynthesisUtterance(speechText.replace(/\s*\n+\s*/g, ". "));
                    const _ttsMap = { hu: "hu-HU", en: "en-US", de: "de-DE", fr: "fr-FR", es: "es-ES", it: "it-IT", pt: "pt-BR", pl: "pl-PL" };
                    utterance.lang = _ttsMap[String(lang).toLowerCase()] || lang;
                    utterance.rate = configSpeed;
                    const voices = window.speechSynthesis.getVoices();
                    const lowerLang = utterance.lang.toLowerCase();
                    let chosenVoice = null;
                    for (const v of voices) {
                        const l = v.lang.toLowerCase();
                        if (!(l.startsWith(lowerLang) || lowerLang.startsWith(l) || l.split("-")[0] === lowerLang.split("-")[0])) continue;
                        const name = v.name.toLowerCase();
                        if (configVoiceGender === "male" && (name.includes("male") || name.includes("szabolcs") || name.includes("david"))) { chosenVoice = v; break; }
                        if (configVoiceGender === "female" && (name.includes("female") || name.includes("tünde") || name.includes("zsuzsa"))) { chosenVoice = v; break; }
                    }
                    if (!chosenVoice) chosenVoice = voices.find(v => v.lang.toLowerCase().split("-")[0] === lowerLang.split("-")[0]) || null;
                    if (chosenVoice) utterance.voice = chosenVoice;
                    utterance.onend = () => setMusicTarget(musicLevelFor(currentElement, currentPage, false, false));
                    window.speechSynthesis.speak(utterance);
                    speaking = true;
                }
            }
            // 3) videó saját hangja is "hang"-nak számít (kivéve, ha a szerző letiltotta – F27)
            const videoSound = currentPage && currentPage.type === "video" && !currentPage.videoMuted && !pageVideoEl.muted;
            setMusicTarget(musicLevelFor(currentElement, currentPage, videoSound, speaking));
        }

        function applyGuidedViewLogic(maxW, maxH) {
            const img = document.getElementById("comicImage");
            const highlight = document.getElementById("focusHighlight");
            const viewport = document.getElementById("canvasViewport");
            // F34: videó- és záróoldalon nincs kép (naturalWidth), de a szöveg/felirat
            // gombjai (📄, 💬) ott is frissítsék a megjelenítést.
            if (introActive) {
                const sb = document.getElementById("subtitleBar"); if (sb) sb.style.display = "none";
                document.getElementById("focusHighlight").style.display = "none";
                return;
            }
            if (activeMagazineData && currentPageType() === "video") { layoutVideo(maxW, maxH); updateTextAndAudio(null); return; }
            if (activeMagazineData && ["credits"].includes(currentPageType())) { updateTextAndAudio(null); return; }
            if (!img || !img.naturalWidth || !activeMagazineData) return;

            const nw = img.naturalWidth;
            const nh = img.naturalHeight;
            const currentPage = activeMagazineData.pages[pageIdx];
            const elements = currentPage.elements || [];

            if (!gvMode) blockIdx = -1;
            updateTextAndAudio(elements[blockIdx]);

            const scaleX = maxW / nw;
            const scaleY = maxH / nh;
            const baseScale = Math.min(scaleX, scaleY);

            const initialX = (maxW - (nw * baseScale)) / 2;
            const initialY = 0;   // a teljes oldal közvetlenül a menüsor alatt indul (vízszintesen középen)

            if (blockIdx === -1 || !elements[blockIdx]) {
                img.style.width = nw + "px";
                img.style.height = nh + "px";
                lastFullRect = { x: initialX, y: initialY, w: nw * baseScale, h: nh * baseScale };
                if (!gvMode) {
                    // PV: szabad nagyítás/eltolás, az eltolás korlátozva, hogy a kép ne csússzon ki
                    const sc = baseScale * viewScale, sw = nw * sc, sh = nh * sc;
                    let tx = initialX + viewTx, ty = initialY + viewTy;
                    tx = (sw <= maxW) ? (maxW - sw) / 2 : Math.min(0, Math.max(maxW - sw, tx));
                    ty = (sh <= maxH) ? 0 : Math.min(0, Math.max(maxH - sh, ty));
                    viewTx = tx - initialX; viewTy = ty - initialY;
                    pvBase = { ix: initialX, iy: initialY, bs: baseScale, W: maxW, H: maxH, nw, nh };
                    lastFullRect = { x: tx, y: ty, w: sw, h: sh };
                    img.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
                } else
                img.style.transform = `translate(${initialX}px, ${initialY}px) scale(${baseScale})`;
                highlight.style.display = "none";
                
                viewport.style.paddingBottom = "0px";
                viewport.scrollTop = 0; 
                subWindowIdx = 0; 
            } else {
                highlight.style.display = "block";
                const block = elements[blockIdx];
                const bx1 = parseInt(block.x1) || 0; 
                const by1 = parseInt(block.y1) || 0;
                const bx2 = parseInt(block.x2) || nw; 
                const by2 = parseInt(block.y2) || nh;
                const bw = bx2 - bx1; 
                const bh = by2 - by1; 

                img.style.width = nw + "px";
                img.style.height = nh + "px";

                // A magazin-korszakban itt még két eltérő zoom-mód volt (a "Hasáb" típusú,
                // szélesség-kitöltő, függőlegesen görgethető szövegoszlopokhoz, és a "Kép"
                // típusú, mindkét irányban belülre illesztett paneleknek). Mivel csak
                // képregény-panelek maradtak, egységesen az utóbbi (kontain-fit) logika él.
                const zoomX = maxW / (bw * baseScale);
                const zoomY = maxH / (bh * baseScale);
                const zoom = Math.min(zoomX, zoomY) * 0.95;

                const totalScale = baseScale * zoom;
                const moveX = (maxW / 2) - ((bx1 + bw / 2) * totalScale);
                let moveY = -(by1 * totalScale);

                img.style.transform = `translate(${moveX}px, ${moveY}px) scale(${totalScale})`;

                highlight.style.left = (bx1 * totalScale + moveX) + "px";
                highlight.style.top = (by1 * totalScale + moveY) + "px";
                highlight.style.width = (bw * totalScale) + "px";
                highlight.style.height = (bh * totalScale) + "px";

                viewport.style.paddingBottom = "0px";
                subWindowIdx = 0;
            }
        }

        // === T8: ELŐTÖLTÉS (videóval együtt) + TELJES HÁTTÉR-LETÖLTÉS ===
        // Ablak: az aktuális oldal + 2 előre + 1 vissza. A videók fetch -> Blob -> helyi "blob:" URL-ként
        // a memóriában vannak, így lapozáskor azonnal indulnak (nincs töltés, szürke/sötét felület).
        // Az ablakon kívüli videók blobját felszabadítjuk (memória). A teljes kiadvány a háttérben,
        // alacsony prioritással, sorban letöltődik (látható haladásjelző nélkül - döntés 2026-10-12):
        // https-en a böngésző tartós gyorsítótárába (Cache API), máshol legalább a HTTP-gyorsítótárba.
        // file://-ről megnyitva nincs fetch: ilyenkor a videó a régi módon, közvetlenül töltődik.
        const MediaStore = (() => {
            const httpOk = /^https?:$/.test(location.protocol);
            const MAX_BLOB_BYTES = 80 * 1024 * 1024;   // ennél nagyobb videót nem tartunk memóriában (folyamatos letöltéssel szól)
            const entries = new Map();   // url -> { objUrl: string|null, p: Promise }
            let cacheP = null, quotaFull = false, windowBusy = 0, idleWaiters = [], winChain = Promise.resolve(), bgStarted = false;
            const abs = (u) => new URL(u, location.href).href;
            const extType = (u) => { const m = String(u).toLowerCase().match(/\.(mp4|m4v|webm|ogv|mov)(\?|$)/); return m ? ({ mp4: "video/mp4", m4v: "video/mp4", webm: "video/webm", ogv: "video/ogg", mov: "video/quicktime" })[m[1]] : ""; };
            function cacheName() {
                const id = activeMagazineData && activeMagazineData.meta && activeMagazineData.meta.exportId;
                return id ? "zcfx|" + location.pathname.replace(/[^/]*$/, "") + "|" + id : null;
            }
            function openCache() {
                if (cacheP) return cacheP;
                const name = cacheName();
                if (!httpOk || !name || !window.caches || !window.isSecureContext) return (cacheP = Promise.resolve(null));
                cacheP = (async () => {
                    try {
                        // ugyanennek a kiadványnak a régebbi exportjai törlődnek (más kiadványé nem)
                        const prefix = name.slice(0, name.lastIndexOf("|") + 1);
                        for (const k of await caches.keys()) if (k.startsWith(prefix) && k !== name) caches.delete(k);
                        return await caches.open(name);
                    } catch (_) { return null; }
                })();
                return cacheP;
            }
            async function fetchStored(url) {
                const c = await openCache();
                if (c) { try { const hit = await c.match(abs(url)); if (hit) return hit; } catch (_) {} }
                const r = await fetch(url);
                if (!r.ok) throw new Error("HTTP " + r.status);
                if (c && !quotaFull) { try { await c.put(abs(url), r.clone()); } catch (_) { quotaFull = true; } }
                return r;
            }
            function notifyIdle() { if (!windowBusy) idleWaiters.splice(0).forEach(f => f()); }
            // Videó előtöltése blobba (sorban: amit előbb kérünk - az aktuális oldal -, az töltődik előbb).
            function want(url) {
                if (!httpOk || !url) return Promise.resolve(null);
                let e = entries.get(url);
                if (e) return e.p;
                e = { objUrl: null };
                entries.set(url, e);
                windowBusy++;
                e.p = (winChain = winChain.then(async () => {
                    if (entries.get(url) !== e) return null;   // közben kikerült az ablakból
                    try {
                        const r = await fetchStored(url);
                        const len = parseInt(r.headers.get("content-length") || "0", 10);
                        if (len > MAX_BLOB_BYTES) return null;
                        let b = await r.blob();
                        if (!b.type || !/^video\//.test(b.type)) { const t = extType(url); if (t) b = new Blob([b], { type: t }); }
                        if (entries.get(url) !== e) return null;
                        e.objUrl = URL.createObjectURL(b);
                        return e.objUrl;
                    } catch (_) { return null; }
                }).finally(() => { windowBusy--; notifyIdle(); }));
                return e.p;
            }
            function peek(url) { const e = entries.get(url); return (e && e.objUrl) || null; }
            function releaseExcept(keep) {
                for (const [url, e] of Array.from(entries)) {
                    if (keep.has(url)) continue;
                    entries.delete(url);
                    if (e.objUrl) { try { URL.revokeObjectURL(e.objUrl); } catch (_) {} }
                }
            }
            const waitIdle = () => windowBusy ? new Promise(r => idleWaiters.push(r)) : Promise.resolve();
            const waitVisible = () => !document.hidden ? Promise.resolve() : new Promise(r => {
                const f = () => { if (!document.hidden) { document.removeEventListener("visibilitychange", f); r(); } };
                document.addEventListener("visibilitychange", f);
            });
            // A teljes kiadvány letöltése a háttérben, egyesével; az ablak (aktuális oldal) mindig elsőbbséget kap.
            async function startBackground(urls) {
                if (bgStarted || !httpOk || !cacheName()) return;   // élő előnézetnél (nincs exportId) nem kell
                bgStarted = true;
                const c = await openCache();
                for (const u of urls) {
                    await waitIdle(); await waitVisible();
                    try {
                        if (c && !quotaFull) {
                            if (await c.match(abs(u))) continue;
                            const r = await fetch(u);
                            if (r.ok) { try { await c.put(abs(u), r); } catch (_) { quotaFull = true; } }
                        } else {
                            // nincs tartós tár: letöltjük és eldobjuk (a HTTP-gyorsítótár megtartja, ha tudja) - memóriát nem foglal
                            const r = await fetch(u);
                            if (r.ok && r.body && r.body.getReader) { const rd = r.body.getReader(); while (!(await rd.read()).done) {} }
                        }
                    } catch (_) {}
                }
            }
            // 6. kör: „Offline olvasás” – minden fájl a tartós tárba, haladásjelzéssel (a már tárolt fájlokat kihagyja)
            async function downloadAll(urls, onProgress) {
                const c = await openCache();
                if (!c) return { ok: false, reason: "nocache" };
                let done = 0, failed = 0;
                onProgress(done, urls.length);
                for (const u of urls) {
                    try {
                        if (!(await c.match(abs(u)))) {
                            const r = await fetch(u, { cache: "reload" });
                            if (r.ok) await c.put(abs(u), r); else failed++;
                        }
                    } catch (e) { failed++; if (e && e.name === "QuotaExceededError") { quotaFull = true; return { ok: false, reason: "quota" }; } }
                    onProgress(++done, urls.length);
                }
                return { ok: failed === 0, failed };
            }
            return { want, peek, releaseExcept, startBackground, downloadAll };
        })();

        // A háttérben letöltendő fájlok, olvasási sorrendben (oldalanként kép/poszter/hangok/videó, majd a zenék).
        function allMediaUrls() {
            const out = [], seen = new Set();
            const add = (u) => { if (u && !seen.has(u)) { seen.add(u); out.push(u); } };
            const pages = (activeMagazineData && activeMagazineData.pages) || [];
            for (const pg of pages) {
                add(pg.imagePath); add(pg.posterPath); add(pg.audioPath);
