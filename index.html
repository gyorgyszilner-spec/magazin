                    e.preventDefault(); triggerNext(); break;
                case "ArrowLeft": case "PageUp":
                    e.preventDefault(); triggerPrev(); break;
                case "t": case "T": toggleSubs(); break;
                case "s": case "S": toggleAllSound(); break;
                case "Escape": closeMenus(); closeMetaPage(); break;
            }
        });

        // JAVASCRIPT GESZTUSMOTOR 5 RESZ VEGE






             // === JAVASCRIPT 6. RÉSZ: UNIVERZÁLIS, TISZTA NAVIGÁCIÓS MOTOR ===
        // P3: lapozás-effekt. A mostani oldal "pillanatképe" átfordul, alatta már a következő oldal van.
        // Képnél előbb kizoomol a teljes oldalra; videónál a pillanatnyi képkocka, a bemutatóoldalnál maga az oldal fordul át.
        // T4: a lapozás áttűnés nélkül, VÉGIG megy (a lap 180°-ban átfordul, a hátoldala is látszik).
        // T7/T11: gyenge eszközön egyszerű síkbeli csúsztatás; a ☰ menüben ki/be kapcsolható (megjegyzi).
        const TURN_MS = 480, SLIDE_MS = 300;
        function isWeakDevice() {
            try { if (localStorage.getItem("zcfx.weakDevice") === "1") return true; } catch (_) {}
            const mem = navigator.deviceMemory, cpu = navigator.hardwareConcurrency;
            if (mem && mem <= 2) return true;
            if (cpu && cpu <= 2) return true;
            if (window.CSS && CSS.supports && !CSS.supports("transform-style", "preserve-3d")) return true;
            return false;
        }
        function turnFxEnabled() {
            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
            try { return localStorage.getItem("zcfx.turnFx") !== "off"; } catch (_) { return true; }
        }
        function setTurnFx(on) { try { localStorage.setItem("zcfx.turnFx", on ? "on" : "off"); } catch (_) {} updateUiLanguage(); }
        function turnMode() { return !turnFxEnabled() ? "off" : (isWeakDevice() ? "slide" : "3d"); }
        // Az első 3D-s lapozás képkocka-idejét mérjük: ha akadozik (átlag > 45 ms), az eszközt gyengének jelöljük.
        function measureTurnFrames(ms) {
            let last = performance.now(), sum = 0, n = 0;
            const end = last + ms;
            const tick = (t) => { sum += t - last; n++; last = t; if (t < end) requestAnimationFrame(tick); else if (n >= 3 && sum / n > 45) { try { localStorage.setItem("zcfx.weakDevice", "1"); } catch (_) {} } };
            requestAnimationFrame(tick);
        }
        let turnMeasured = false;
        function playTurn(snapNode, r, swap, after) {
            turning = true;
            const mode = turnMode();
            const layer = document.getElementById("turnLayer");
            layer.innerHTML = ""; layer.style.display = "block";
            const pg = document.createElement("div");
            pg.className = "turn-page" + (mode === "slide" ? " tp-slide" : "");
            pg.style.cssText += `left:${r.x}px; top:${r.y}px; width:${r.w}px; height:${r.h}px;`;
            if (mode === "slide") pg.appendChild(snapNode);
            else {
                const front = document.createElement("div"); front.className = "tp-face"; front.appendChild(snapNode);
                const back = document.createElement("div"); back.className = "tp-face tp-back";
                pg.appendChild(front); pg.appendChild(back);
            }
            layer.appendChild(pg);
            swap();
            const dur = mode === "slide" ? SLIDE_MS : TURN_MS;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                if (mode === "slide") {
                    pg.style.transition = `transform ${dur}ms ease-in`;
                    pg.style.transform = `translateX(${-(r.x + r.w + 20)}px)`;
                } else {
                    pg.style.transition = `transform ${dur}ms cubic-bezier(0.45, 0.05, 0.55, 0.95)`;
                    pg.style.transform = "rotateY(-180deg)";
                    if (!turnMeasured) { turnMeasured = true; measureTurnFrames(dur); }
                }
            }));
            setTimeout(() => {
                layer.style.display = "none"; layer.innerHTML = "";
                turning = false;
                const img = document.getElementById("comicImage");
                if (gvMode && currentPageType() === "image" && !startsFull(pageIdx)) {   // Guided oldal: rázoomolás az első blokkra
                    img.style.transition = "transform 0.3s ease";
                    blockIdx = 0; resizeLayout();
                    setTimeout(() => { img.style.transition = ""; }, 350);
                }
                if (after) after();
            }, dur + 50);
        }
        function swapToNextPage() {
            const img = document.getElementById("comicImage");
            pageIdx++; blockIdx = -1; pendingForward = false;
            img.style.transition = "";
            loadCurrentPage();
            img.style.visibility = "hidden";   // amíg az új kép be nem töltődött és el nem helyeződött
        }
        function turnToNextPage() {
            const img = document.getElementById("comicImage");
            const vp = document.getElementById("canvasViewport");
            const type = currentPageType();
            if (type === "video") {
                const v = document.getElementById("pageVideo");
                const vr = v.getBoundingClientRect(), pr = vp.getBoundingClientRect();
                const w = vr.width, h = vr.height, vw = vp.clientWidth, vh = vp.clientHeight;
                let snap;
                const pd = activeMagazineData.pages[pageIdx];
                if (v.readyState < 2 && pd && pd.posterPath) {   // még nincs képkocka: a poszter fordul át
                    snap = document.createElement("img"); snap.src = pd.posterPath;
                    snap.style.cssText = "width:100%; height:100%; display:block; object-fit:contain; background:#000;";
                } else {
                    snap = document.createElement("canvas");
                    snap.width = v.videoWidth || 2; snap.height = v.videoHeight || 2; snap.style.cssText = "width:100%; height:100%; display:block; background:#000;";
                    try { snap.getContext("2d").drawImage(v, 0, 0, snap.width, snap.height); } catch (_) {}
                }
                playTurn(snap, { x: vr.left - pr.left, y: vr.top - pr.top, w, h }, swapToNextPage);
                return;
            }
            const needZoomOut = blockIdx >= 0 || viewScale > 1;
            if (needZoomOut) {
                img.style.transition = "transform 0.25s ease";
                blockIdx = -1; viewScale = 1; viewTx = 0; viewTy = 0;
                resizeLayout();
            }
            setTimeout(() => {
                img.style.transition = "";
                const im = document.createElement("img");
                im.src = img.src; im.style.cssText = "width:100%; height:100%; display:block;";
                playTurn(im, lastFullRect, swapToNextPage);
            }, needZoomOut ? 280 : 0);
        }
        function turnFromIntro() {
            const vp = document.getElementById("canvasViewport");
            const clone = document.getElementById("introPage").cloneNode(true);
            clone.removeAttribute("id");
            clone.style.cssText += "display:block; position:absolute; top:0; left:0; width:100%; height:100%; background:#0f0f10;";
            playTurn(clone, { x: 0, y: 0, w: vp.clientWidth, h: vp.clientHeight }, () => {
                introActive = false; pendingForward = false;
                restoreAfterIntro();
                unlockAudioFromGesture();
                loadCurrentPage();
                document.getElementById("comicImage").style.visibility = "hidden";
                afterIntroChrome();
            });
        }

        function triggerNext() {
            if (!activeMagazineData) return;
            if (turning) return;
            if (introActive) {
                if (turnMode() === "off") leaveIntro(); else turnFromIntro();
                return;
            }
            const elements = activeMagazineData.pages[pageIdx].elements || [];
            const viewport = document.getElementById("canvasViewport");
            
            // Ha új blokkra lépünk, a görgetődobozt visszaállítjuk a tetejére
            if (viewport) {
                viewport.scrollTop = 0;
                viewport.style.paddingBottom = "0px";
            }
            
            if (gvMode && blockIdx < elements.length - 1) { 
                blockIdx++; 
                resizeLayout(); 
            } else if (pageIdx < activeMagazineData.pages.length - 1 && (currentPageType() === "image" || currentPageType() === "video")
                       && turnMode() !== "off") {
                turnToNextPage();
            } else if (pageIdx < activeMagazineData.pages.length - 1) { 
                pageIdx++; 
                blockIdx = -1; 
                pendingForward = true;   // Guided oldalnál a kép betöltése után rögtön az első blokkra ugrik
                loadCurrentPage(); 
            }
        }

        function triggerPrev() {
            if (!activeMagazineData) return;
            if (turning) return;
            if (introActive) return;   // a bemutatóoldalról nincs hova visszalépni
            const viewport = document.getElementById("canvasViewport");
            
            // Ha visszalépünk egy blokkot, a görgetődobozt visszaállítjuk a tetejére
            if (viewport) {
                viewport.scrollTop = 0;
                viewport.style.paddingBottom = "0px";
            }
            
            if (gvMode && blockIdx > minBlockIdx()) { 
                blockIdx--; 
                resizeLayout(); 
            } else if (pageIdx === 0) {
                showIntro();           // a címlapról a "hátra" a bemutatóoldalra visz
            } else if (pageIdx > 0) { 
                pageIdx--; 
                const p = activeMagazineData.pages[pageIdx]; 
                blockIdx = (gvMode && p.elements?.length) ? p.elements.length - 1 : -1; 
                loadCurrentPage(); 
            }
        }

        // JAVASCRIPT NAVIGACIOS LOGIKA 6 RESZ VEGE






              // === JAVASCRIPT 7. RÉSZ: ESEMÉNYKEZELŐK ÉS INICIALIZÁLÁS ===
        window.addEventListener("resize", resizeLayout);

        window.addEventListener("DOMContentLoaded", async () => {
            activeMagazineData = window.MAGAZINE_DATA || null;

            // ⭐ H.2: élő előnézet a szerkesztőből ("?previewProject=NÉV", "?page=N") – teljes export nélkül.
            let previewJumpPage = 0;
            if (!activeMagazineData) {
                const params = new URLSearchParams(window.location.search);
                const previewProject = params.get("previewProject");
                if (previewProject) {
                    try {
                        const resp = await fetch(`/api/projects/${encodeURIComponent(previewProject)}/preview-data`);
                        if (resp.ok) activeMagazineData = await resp.json();
                    } catch (_) { /* marad null, a loadError ágat futtatja lent */ }
                }
                const pageParam = parseInt(params.get("page"), 10);
                if (!isNaN(pageParam) && pageParam >= 0) previewJumpPage = pageParam;
            }

            // T20/T21: élő előnézetben a betűk külön CSS-ből jönnek; a téma háttérképei és betűje
            if (activeMagazineData && activeMagazineData.fontCssUrl) {
                const l = document.createElement("link"); l.rel = "stylesheet"; l.href = activeMagazineData.fontCssUrl; document.head.appendChild(l);
            }
            (function applyTheme() {
                const th = (activeMagazineData && activeMagazineData.playerTheme) || {};
                const bg = document.getElementById("appBg");
                const cssUrl = (u) => `url("${String(u).replace(/"/g, "%22")}")`;
                if (th.bgPortrait) { bg.style.setProperty("--bg-portrait", cssUrl(th.bgPortrait)); bg.classList.add("has-bg-portrait"); }
                if (th.bgLandscape) { bg.style.setProperty("--bg-landscape", cssUrl(th.bgLandscape)); bg.classList.add("has-bg-landscape"); }
                // 6. kör: a szerző igazítása (pl. a kép tetejére tett logó mindig látsszon)
                bg.style.setProperty("--bg-portrait-pos", { top: "center top", bottom: "center bottom" }[th.bgPortraitAlign] || "center center");
                bg.style.setProperty("--bg-landscape-pos", { left: "left center", right: "right center" }[th.bgLandscapeAlign] || "center center");
                document.documentElement.style.setProperty("--pl-text-font", fontStackFor("", false));
                document.documentElement.style.setProperty("--pl-theme-font", fontStackFor("", true));
            })();

            // Gépen (nincs érintőképernyő) alapból látszanak a menüsorok, hogy legyen mivel lapozni.
            const primaryIsTouch = window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : ("ontouchstart" in window);
            if (!primaryIsTouch) configBarFixed = true;
            try { const fx = localStorage.getItem("zcfx.barsFixed"); if (fx === "1") configBarFixed = true; else if (fx === "0") configBarFixed = false; } catch (_) {}
            try { const ts = localStorage.getItem("zcfx.txtSize"); if (TXT_SIZES.includes(ts)) configTxtSize = ts; } catch (_) {}
            setTxtSize(configTxtSize);

            // Player-nyelv: megjegyzett > böngésző nyelve > a szerző alapértelmezése
            (function initPlayerLang() {
                const codes = playerLangCodes();
                const ui = (activeMagazineData && activeMagazineData.playerUi) || {};
                if (codes.length === 1) currentLang = codes[0];
                if (codes.length > 1) {
                    let pick = null;
                    try { const sv = localStorage.getItem("zcfx.playerLang"); if (sv && codes.includes(sv)) pick = sv; } catch (_) {}
                    if (!pick) {
                        const nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
                        for (const l of nav) { const c = String(l).toLowerCase(); const hit = codes.find(x => x.toLowerCase() === c) || codes.find(x => x.toLowerCase().split("-")[0] === c.split("-")[0]); if (hit) { pick = hit; break; } }
                    }
                    if (!pick) pick = (ui.default && codes.includes(ui.default)) ? ui.default : codes[0];
                    currentLang = pick;
                }
            })();

            if (activeMagazineData) {
                // T14: kezdőállapot a szerző export-beállításából (meta.playerStart)
                const ps = playerStart();
                const tr = translationCodes();
                const valid = (v, extra) => v === extra || v === "ORIG" || tr.includes(v);
                subsLang = valid(ps.subsLang, "none") ? ps.subsLang : (ps.subs === true ? "ORIG" : "none");
                ttsLang = valid(ps.ttsLang, "off") ? ps.ttsLang : (ps.sound === true ? "ORIG" : "off");
                // az olvasó korábbi nyelvi választása (felirat, felolvasás) erősebb
                try { const sv = localStorage.getItem("zcfx.subsLang"); if (sv && valid(sv, "none")) subsLang = sv; } catch (_) {}
                try { const sv = localStorage.getItem("zcfx.ttsLang"); if (sv && valid(sv, "off")) ttsLang = sv; } catch (_) {}
                if (subsLang !== "none") lastSubsLang = subsLang;
                musicOn = ps.music !== false;
                blockSoundOn = ps.blockSound !== undefined ? ps.blockSound !== false : true;
            }
            // F28: GV/PV. Az olvasó (böngészőben megjegyzett) választása erősebb, mint az export kezdőnézete.
            (function initViewMode() {
                const hasBlocks = activeMagazineData && (activeMagazineData.pages || []).some(pg => (pg.elements || []).length);
                const btn = document.getElementById("btnView");
                if (!hasBlocks) { btn.style.display = "none"; gvMode = true; return; }
                let m = playerStart().viewMode === "PV" ? "PV" : "GV";
                try { const sv = localStorage.getItem("zcfx.viewMode"); if (sv === "GV" || sv === "PV") m = sv; } catch (_) {}
                gvMode = (m !== "PV");
                btn.textContent = gvMode ? "GV" : "PV";
                document.getElementById("btnSound").classList.toggle("pv-off", !gvMode);
                btn.onclick = () => setViewMode(gvMode ? "PV" : "GV", !introActive);   // a bemutatóoldalon nem jegyezzük meg (T19)
            })();
            updateUiLanguage();

            if (activeMagazineData && activeMagazineData.pages && activeMagazineData.pages.length) {
                document.title = (activeMagazineData.meta && activeMagazineData.meta.title) || document.title;
                pageIdx = Math.min(Math.max(0, previewJumpPage), activeMagazineData.pages.length - 1); blockIdx = -1;
                pendingForward = true;
                if (previewJumpPage === 0 && !new URLSearchParams(window.location.search).has("page")) {
                    updateBackgroundMusicForPage(1);   // a zene előkészítése: a bemutatóoldalról továbblépés indítja
                    showIntro();
                } else {
                    loadCurrentPage();
                    if (!configBarFixed) scheduleChromeHide(3000);
                }
                checkVoiceAvailability(ttsLang !== "off" && ttsLang !== "ORIG" ? ttsLang : baseLang());
                // T8: a teljes kiadvány letöltése a háttérben (az ablak betöltése után, csendben)
                setTimeout(() => MediaStore.startBackground(allMediaUrls()), 1500);
            } else {
                document.getElementById("loadError").style.display = "block";
                checkVoiceAvailability(baseLang());
            }
            resizeLayout();

            // ---- vezérlők ----
            document.getElementById("btnLang").onclick = (e) => { e.stopPropagation(); buildLangPanel(); openMenu("langPanel", "btnLang"); if (document.getElementById("langPanel").classList.contains("open")) buildLangPanel(); };
            document.getElementById("btnSound").onclick = (e) => { e.stopPropagation(); updateSoundButton(); openMenu("soundPanel", "btnSound"); };
            document.getElementById("menuDim").onclick = () => { closeMenus(); if (!introActive && !configBarFixed) scheduleChromeHide(2500); };
            document.getElementById("sndAll").onclick = () => { toggleAllSound(); };
            document.getElementById("sndMusic").onclick = () => setMusicOn(!musicOn);
            document.getElementById("sndBlock").onclick = () => setBlockSoundOn(!blockSoundOn);
            document.getElementById("btnMenu").onclick = () => { closeMenus(); document.getElementById("popSettings").style.display = "flex"; showChrome(true); };
            document.getElementById("btnMetaOpen").onclick = openMetaPage;
            document.getElementById("rowOffline").style.display = offlineAllowed() ? "" : "none";
            document.getElementById("btnOffline").onclick = openOffline;
            document.getElementById("btnOfflineClose").onclick = () => { document.getElementById("popOffline").style.display = "none"; scheduleChromeHide(3000); };
            document.getElementById("btnInstall").onclick = async () => {
                if (!installPrompt) return;
                try { installPrompt.prompt(); await installPrompt.userChoice; } catch (_) {}
                installPrompt = null; updateInstallUi();
            };
            registerSw();
            document.getElementById("metaClose").onclick = closeMetaPage;
            document.getElementById("chromeTab").onclick = (e) => { e.stopPropagation(); showChrome(); };
            document.getElementById("chromeTabBottom").onclick = (e) => { e.stopPropagation(); showChrome(); };
            document.getElementById("introStart").onclick = (e) => { e.stopPropagation(); triggerNext(); };
            document.getElementById("btnTxtZoom").onclick = (e) => { e.stopPropagation(); setTxtSize(TXT_SIZES[(TXT_SIZES.indexOf(configTxtSize) + 1) % TXT_SIZES.length]); showChrome(); };
            // a menüsorokon végzett művelet közben ne rejtőzzenek el
            ["topBar", "bottomBar"].forEach(id => document.getElementById(id).addEventListener("pointerdown", () => { if (!chromeShouldStay()) scheduleChromeHide(4000); }));

            document.getElementById("btnNext").onclick = () => { triggerNext(); };
            document.getElementById("btnPrev").onclick = () => { triggerPrev(); };
            window.addEventListener("resize", () => { if (document.getElementById("langPanel").classList.contains("open")) buildLangPanel(); });

            // Beállítások (☰) ablak
            document.querySelectorAll("#szGrid button").forEach(b => { b.onclick = () => setTxtSize(b.dataset.sz); b.title = b.dataset.sz; });
            const setSpeed = (v, id) => { configSpeed = v; ["btnSpeedS", "btnSpeedN", "btnSpeedF"].forEach(x => document.getElementById(x).classList.toggle("active", x === id)); };
            document.getElementById("btnSpeedS").onclick = () => setSpeed(0.8, "btnSpeedS");
            document.getElementById("btnSpeedN").onclick = () => setSpeed(1.0, "btnSpeedN");
            document.getElementById("btnSpeedF").onclick = () => setSpeed(1.3, "btnSpeedF");
            document.getElementById("btnVoiceToggle").onclick = function() {
                if (this.getAttribute("disabled")) return;
                configVoiceGender = (configVoiceGender === "female") ? "male" : "female";
                checkVoiceAvailability(ttsLang !== "off" && ttsLang !== "ORIG" ? ttsLang : baseLang());
            };
            document.getElementById("btnTurnFx").onclick = () => setTurnFx(!turnFxEnabled());
            document.getElementById("btnBarToggle").onclick = function() {
                configBarFixed = !configBarFixed;
                try { localStorage.setItem("zcfx.barsFixed", configBarFixed ? "1" : "0"); } catch (_) {}
                updateUiLanguage();
                resizeLayout();
            };
            document.getElementById("btnCloseSettings").onclick = () => {
                document.getElementById("popSettings").style.display = "none";
                resizeLayout();
                if (!introActive && !configBarFixed) scheduleChromeHide(2500);
            };
            document.getElementById("popSettings").addEventListener("click", (e) => { if (e.target.id === "popSettings") document.getElementById("btnCloseSettings").click(); });
        });
    </script>
</body>
