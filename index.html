<!-- FÁJLNEV: lib/player/player.html (az export index.html-jének sablonja)
     A régi reader.html-ből átvéve (3. ütem), javítva: adat a data.js-ből (nincs fetch,
     file://-ről is működik), nincs külső betűtípus, van videó- és záró oldal,
     billentyű/egér-vezérlés gépen. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zéország</title>
    
    
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        /* F24/1: a vízszintes suhintás ne váltson böngésző-előzményt (vissza/előre gesztus) */
        html, body { overscroll-behavior-x: none; }
        button, input, select, textarea { font-family: inherit; }
        #canvasViewport { touch-action: pan-y; }
        body {
            background-color: #0f1014; margin: 0; padding: 0;
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        #appBg {
            width: 100vw; height: 100vh; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; box-sizing: border-box; position: relative;
        }
        #topBar {
            position: fixed; top: 0; left: 0; width: 100%; height: 46px; display: flex;
            justify-content: space-between; align-items: center; padding: 0 10px; box-sizing: border-box;
            background-color: #121318; z-index: 100; border-bottom: 1px solid #1f222e;
        }
        .top-left-group, .top-right-group { display: flex; align-items: center; gap: 5px; }
        .retro-btn {
            background: none; border: none; color: #f4f1ea; font-size: 20px; font-weight: bold;
            cursor: pointer; padding: 5px 10px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; min-width: 40px; min-height: 40px; border-radius: 4px;
        }
        .retro-btn:active { transform: scale(0.9); }
        .retro-btn.active { 
            color: #ff9d3b; background: rgba(139, 90, 43, 0.25);
            box-shadow: inset 0 0 8px rgba(255, 157, 59, 0.3); border: 1px solid rgba(255, 157, 59, 0.4);
        }
        #btnLang { font-size: 14px; font-weight: bold; color: #ff9d3b; }
        /* Lenyíló nyelvválasztó (a szerző által az exportnál megadott játszó-nyelvek) */
        #langWrap { position: relative; }
        #langDropdown {
            display: none; position: absolute; top: 44px; left: 0; min-width: 150px; max-height: 70vh; overflow-y: auto;
            background: #16181f; border: 1px solid #8B5A2B; border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,0.7); z-index: 300;
        }
        #langDropdown.open { display: block; }
        #langDropdown button {
            display: block; width: 100%; text-align: left; background: none; border: none; color: #f4f1ea;
            padding: 11px 14px; font-size: 14px; cursor: pointer; white-space: nowrap;
        }
        #langDropdown button.active { background: #8B5A2B; color: #fff; }
        
        /* ⭐ FIX: Visszaállítva a flex-grow és a kényszerített belső görgetés a valós magassághoz */
        #canvasViewport {
            position: relative; overflow-x: hidden !important; overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch; display: flex; align-items: flex-start; justify-content: flex-start;
            box-sizing: border-box; width: 100%; flex-grow: 1; background-color: #000; 
            margin-top: 46px; margin-bottom: 0px; transition: margin-bottom 0.3s ease;
        }
        #comicImage {
            position: absolute; display: block; top: 0; left: 0; transform-origin: 0 0;
            opacity: 1; transition: transform 0.1s linear; will-change: transform;
        }
        #focusHighlight {
            position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); 
            border: 2px solid #ff9d3b; pointer-events: none; z-index: 10; display: none; border-radius: 4px;
        }

        /* Feliratsáv (F13/F19, 2.3.0): EGYETLEN szövegmegjelenítő - mindig a lap ALJÁN; a régi,
           felül lévő 📄 szövegdoboz megszűnt. A betűméretet a Beállítások "Szövegméret" adja. */
        #subtitleBar.txt-size-small { font-size: 14px; }
        #subtitleBar.txt-size-medium { font-size: 18px; }
        #subtitleBar.txt-size-large { font-size: 22px; }
        #subtitleBar {
            position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box;
            padding: 10px 18px; background: rgba(15,16,20,0.92); color: #f4f1ea;
            font-size: 15px; line-height: 1.4; text-align: center; z-index: 140;
            border-top: 1px solid #8B5A2B; display: none; max-height: 40%; overflow-y: auto;
        }
        /* Videó-oldalon a bal/jobb szélső 25% fölé átlátszó "lapozózóna" kerül (a vezérlősáv helye szabad marad):
           a koppintás/suhintás így a videóelemhez (lejátszás/szünet, natív vezérlők) sem jut el, csak lapoz. */
        .video-zone { position: absolute; top: 0; width: 25%; height: calc(100% - 64px); z-index: 20; display: none; }
        #vzLeft { left: 0; } #vzRight { right: 0; }
        #popContentLang .lang-list { max-height: 260px; overflow-y: auto; }

        #bottomBar {
            position: fixed; bottom: -60px; left: 0; width: 100%; height: 54px; display: flex;
            justify-content: flex-end; align-items: center; padding: 0 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box; background-color: #121318; z-index: 100;
            transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1); gap: 15px;
        }
        #bottomBar.visible { bottom: 0px; }
        
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 200; display: none; justify-content: center; align-items: center;
        }
        .popup-window {
            background: #16181f; border: 1px solid #8B5A2B; border-radius: 10px;
            padding: 20px; width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .popup-title { color: #ff9d3b; font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .popup-row { margin-bottom: 15px; }
        .popup-label { color: #9aa0a6; font-size: 13px; margin-bottom: 5px; }
        .btn-grid { display: flex; gap: 5px; width: 100%; }
        .btn-grid button, .popup-close, .lang-opt {
            flex: 1; background: #222530; border: 1px solid #33384a; color: #f4f1ea;
            padding: 10px; font-size: 14px; cursor: pointer; border-radius: 4px; font-weight: bold;
        }
        .btn-grid button.active, .lang-opt.active { background: #8B5A2B; border-color: #ff9d3b; color: #fff; }
        .popup-close { width: 100%; margin-top: 10px; background: #2a2e3d; border: none; color: #ff9d3b; }
        .lang-list { display: flex; flex-direction: column; gap: 8px; }

        #pageVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; background: #000; display: none;
        }
        #creditsPage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center; text-align: center;
            overflow-y: auto;
            background: #0f1014; color: #f4f1ea; padding: 30px; box-sizing: border-box;
            font-family: 'Playfair Display', 'Noto Sans', 'Georgia', serif;
        }
        #creditsPage .credits-title { font-size: 26px; font-weight: bold; color: #ff9d3b; margin-bottom: 8px; }
        #creditsPage .credits-author { font-size: 16px; color: #9aa0a6; margin-bottom: 34px; }
        #creditsPage .credits-text { font-size: 15px; font-style: italic; color: #c9c2b3; }
        #creditsPage > div { margin: auto; max-width: 560px; }
        #creditsPage .credits-brand { margin-top: 30px; padding-top: 22px; border-top: 1px solid #8B5A2B; }
        #creditsPage .credits-brand-name { font-size: 22px; font-weight: bold; color: #ff9d3b; }
        #creditsPage .credits-tagline { font-size: 14px; font-style: italic; color: #9aa0a6; margin: 4px 0 14px; }
        #creditsPage .credits-features { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.7; color: #c9c2b3; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        #loadError { color: #f4f1ea; padding: 30px; font-size: 16px; display: none; }
    </style>
</head>

<body>

    <div id="appBg">
        <div id="topBar">
            <div class="top-left-group">
                <div id="langWrap">
                    <button id="btnLang" class="retro-btn" data-pl-title="plLangTitle">English ▾</button>
                    <div id="langDropdown"></div>
                </div>
            </div>
            <div class="top-right-group">
                <!-- ⭐ FORDÍTÁSI RENDSZER - 2. réteg: a kiadvány SZÖVEGÉNEK
                     fordítása (nem a kezelőfelület nyelve - az a bal felső
                     "HU/EN" gomb, változatlan). Csak akkor jelenik meg, ha
                     a projektnek van legalább egy elmentett fordítása
                     (ld. initPlayer()). -->
                <button id="btnContentLang" class="retro-btn" data-pl-title="plContentLangTitle" style="display:none;">🌐</button>
                <button id="btnSubs" class="retro-btn active" data-pl-title="plSubsTitle">💬</button>
                <button id="btnSound" class="retro-btn" data-pl-title="plSoundTitle">🔊</button>
                <button id="btnMenu" class="retro-btn" data-pl-title="plSetTitle">☰</button>
            </div>
        </div>

        <div id="canvasViewport">
            <img id="comicImage" alt="" data-pl-alt="plImgAlt">
            <video id="pageVideo" controls playsinline preload="auto"></video>
            <div id="vzLeft" class="video-zone"></div><div id="vzRight" class="video-zone"></div>
            <div id="creditsPage">
                <div>
                    <div class="credits-title" id="creditsTitle"></div>
                    <div class="credits-author" id="creditsAuthor"></div>
                    <div class="credits-text" id="creditsText"></div>
                    <div class="credits-brand">
                        <div class="credits-brand-name">ZoomComicFX</div>
                        <div class="credits-tagline" id="creditsTagline"></div>
                        <ul class="credits-features" id="creditsFeatures"></ul>
                    </div>
                </div>
            </div>
            <div id="loadError" data-pl="plLoadError">The content cannot be loaded (data.js is missing or corrupted).</div>
            <div id="focusHighlight"></div>
        </div>

        <!-- ⭐ Feliratsáv - mindig a lap ALJÁN (ld. CSS #subtitleBar). -->
        <div id="subtitleBar"></div>

        <div id="bottomBar">
            <button id="btnPrev" class="retro-btn" data-pl="plPrev">◄ Prev</button>
            <button id="btnNext" class="retro-btn" data-pl="plNext">Next ►</button>
        </div>
    </div>


    <!-- ⭐ FORDÍTÁSI RENDSZER - 2. réteg: a kiadvány szövegének (nem a
         kezelőfelületnek) a nyelve - a lista DINAMIKUSAN épül fel a
         data.js-ben kiexportált fordításokból (ld. renderContentLangPopup()),
         az "Eredeti" mindig az első helyen (ld. claude/fordítási-rendszer-spec.md). -->
    <div id="popContentLang" class="popup-overlay">
        <div class="popup-window">
            <div class="popup-title" data-pl="plContentLangTitle">Text language</div>
            <div class="lang-list" id="contentLangList"></div>
            <button class="popup-close" id="btnCloseContentLang">OK</button>
        </div>
    </div>

    <div id="popSettings" class="popup-overlay">
        <div class="popup-window">
            <div class="popup-title" id="lblSetTitle" data-pl="plSetTitle">Settings</div>
            
            <div class="popup-row">
                <div class="popup-label" id="lblSetTxtSize" data-pl="plSetTxtSize">Text size</div>
                <div class="btn-grid">
                    <button id="btnSizeS" class="active" data-pl="plSmall">Small</button>
                    <button id="btnSizeM" data-pl="plMedium">Medium</button>
                    <button id="btnSizeL" data-pl="plLarge">Large</button>
                </div>
            </div>

            <div class="popup-row">
                <div class="popup-label" id="lblSetSpeed" data-pl="plSetSpeed">Reading speed</div>
                <div class="btn-grid">
                    <button id="btnSpeedS" class="active" data-pl="plSlow">Slow</button>
                    <button id="btnSpeedN" data-pl="plNormal">Normal</button>
                    <button id="btnSpeedF" data-pl="plFast">Fast</button>
                </div>
            </div>

            <div class="popup-row">
                <div class="popup-label" id="lblSetVoice" data-pl="plSetVoice">Voice type</div>
                <button id="btnVoiceToggle" style="width:100%; text-align:center;" class="popup-close">Female</button>
            </div>

            <div class="popup-row">
                <div class="popup-label" id="lblSetBar" data-pl="plSetBar">Fix the bottom bar</div>
                <button id="btnBarToggle" style="width:100%; text-align:center;" class="popup-close">OFF</button>
            </div>

            <button class="popup-close" id="btnCloseSettings" style="background:#8B5A2B; color:#fff;" data-pl="plDone">Done</button>
        </div>
    </div>

    <audio id="bgAudioPlayer"></audio>
    <!-- 37. TÉTEL: a projekt-szintű aláfestő zene, külön a blokk/oldal-hangoktól.
         Folyamatosan, végtelenítve szól a teljes kiadvány alatt. -->
    <audio id="bgMusicPlayer" loop></audio>

    <!-- Az export adata: window.MAGAZINE_DATA (így file://-ről is megnyitható) -->
    <script src="data.js"></script>

    <script>
        // === JAVASCRIPT INDÍTÁS: ÁLLAPOTOK ÉS SZÓTÁRAK ===
        let activeMagazineData = null;
        let currentAudioKey = "";
        let lastTouchAt = 0;
        let pageIdx = 0;   
        let blockIdx = -1; 
        let subWindowIdx = 0; 

                let soundActive = false;
        
        let currentLang = "en";   // a PLAYER kezelőfelület-nyelve (kisbetűs kód) - a szerző által az exportnál megadott nyelvek egyike
        // ⭐ FORDÍTÁSI RENDSZER - 2. réteg: a kiadvány SZÖVEGÉNEK fordítása -
        // teljesen független a fenti currentLang-tól (az a kezelőfelület
        // nyelve, ld. "translations" szótár lejjebb). "ORIG" = az eredeti,
        // a szerző által beírt szöveg (nincs fordítás-váltás).
        let contentLang = "ORIG";
        let subsActive = true;    // F13/F19: az EGYETLEN szövegmegjelenítő (felirat) alapból látszik
        let configTxtSize = "small";
        let configSpeed = 0.8;       
        let configVoiceGender = "female"; 
        let configBarFixed = false;  

        const audioPlayer = document.getElementById("bgAudioPlayer");
        const bgMusicPlayer = document.getElementById("bgMusicPlayer");

        // ⭐ 2. ÜTEM - HÁTTÉRZENE-SZERKESZTŐ ÚJRATERVEZÉSE: eddig EGY hangfájl
        // szólt a teljes kiadvány alatt (meta.backgroundAudio). Most TÖBB,
        // oldaltartományhoz rendelt sáv lehet (data.js "backgroundTracks" -
        // ld. lib/exportEngine.js), lapozás közben a megfelelő sávra váltunk.
        // A böngészők (jogosan) nem engedik a hang nélküli felhasználói
        // interakció előtti automatikus lejátszást - ezért először megpróbáljuk
        // simán elindítani, és ha ez eldobásra kerül (NotAllowedError), az első
        // érintésre/kattintásra/gombnyomásra próbáljuk újra, egyszer (összesen
        // csak EGYSZER regisztráljuk a feloldó listenert, nem minden lapozásnál).
        let currentBgTrackId = null;
        let bgMusicUnlockRegistered = false;

        function resolveBgTrackForPage(pageNum) {
            const tracks = (activeMagazineData && activeMagazineData.backgroundTracks) || [];
            // Átfedő tartományoknál a LISTÁBAN HÁTRÉBB lévő sáv nyer - így egy
            // szándékosan felülíró sáv hozzáadható anélkül, hogy a korábbit
            // törölni kellene.
            let found = null;
            for (const t of tracks) {
                const start = t.startPage || 1;
                const end = (t.endPage === null || t.endPage === undefined) ? Infinity : t.endPage;
                if (pageNum >= start && pageNum <= end) found = t;
            }
            return found;
        }

        function updateBackgroundMusicForPage(pageNum) {
            const track = resolveBgTrackForPage(pageNum);
            if (!track) {
                if (currentBgTrackId !== null) { bgMusicPlayer.pause(); currentBgTrackId = null; }
                return;
            }
            if (track.id === currentBgTrackId) return; // ugyanaz a sáv szól tovább - nem indítjuk újra
            currentBgTrackId = track.id;
            bgMusicPlayer.src = track.audioPath;
            bgMusicPlayer.volume = 0.5;
            const tryPlay = () => bgMusicPlayer.play().catch(() => {});
            tryPlay();
            if (!bgMusicUnlockRegistered) {
                bgMusicUnlockRegistered = true;
                const unlock = () => { tryPlay(); document.removeEventListener("pointerdown", unlock); document.removeEventListener("keydown", unlock); };
                document.addEventListener("pointerdown", unlock, { once: true });
                document.addEventListener("keydown", unlock, { once: true });
            }
        }

        // ELSO RESZ VEGE

                // === JAVASCRIPT 2. RÉSZ: NYELVI SZÓTÁR ÉS INTERFÉSZ FRISSÍTÉS ===
        // 2.3.0: a player szövegei a data.js "playerUi" mezőjéből jönnek (a szerkesztő nyelvi csomagjainak
        // "pl..." kulcsai) - az exportnál a szerző megadja, mely nyelveken legyen elérhető a player.
        function pt(key) {
            const ui = (activeMagazineData && activeMagazineData.playerUi) || {};
            const L = ui.languages || {};
            const pick = (c) => (L[c] && L[c][key] !== undefined && L[c][key] !== "") ? L[c][key] : undefined;
            const v = pick(currentLang);
            if (v !== undefined) return v;
            const d = pick(ui.default); if (d !== undefined) return d;
            const e = pick("en"); if (e !== undefined) return e;
            return key;
        }
        // A felolvasás/szövegtartalom alapnyelve: a kiadvány eredeti nyelve (NEM a player felületének nyelve).
        function baseLang() { return (activeMagazineData && activeMagazineData.lang) || "en"; }

        // F30: a záróoldal szövegei a player nyelvén.
        function renderCredits() {
            const made = document.getElementById("creditsText");
            if (made) made.textContent = pt("plCreditsMade");
            const tag = document.getElementById("creditsTagline");
            if (tag) tag.textContent = pt("plCreditsTagline");
            const list = document.getElementById("creditsFeatures");
            if (list) {
                list.innerHTML = "";
                for (let i = 1; i <= 6; i++) { const li = document.createElement("li"); li.textContent = pt("plCredits" + i); list.appendChild(li); }
            }
        }

        function playerLangCodes() {
            const ui = activeMagazineData && activeMagazineData.playerUi;
            return (ui && ui.languages) ? Object.keys(ui.languages) : [];
        }
        function playerLangName(code) {
            const ui = activeMagazineData && activeMagazineData.playerUi;
            const n = ui && ui.languages && ui.languages[code] && ui.languages[code].plLangName;
            return n || code.toUpperCase();
        }

        function updateUiLanguage() {
            document.documentElement.lang = currentLang;
            document.querySelectorAll("[data-pl]").forEach(el => { el.textContent = pt(el.getAttribute("data-pl")); });
            document.querySelectorAll("[data-pl-title]").forEach(el => { el.title = pt(el.getAttribute("data-pl-title")); });
            document.querySelectorAll("[data-pl-alt]").forEach(el => { el.alt = pt(el.getAttribute("data-pl-alt")); });
            document.getElementById("btnLang").innerText = playerLangName(currentLang) + " ▾";

            const vBtn = document.getElementById("btnVoiceToggle");
            if (vBtn.getAttribute("disabled")) {
                vBtn.innerText = pt("plNoVoice");
            } else {
                vBtn.innerText = (configVoiceGender === "female") ? pt("plFemale") : pt("plMale");
            }
            document.getElementById("btnBarToggle").innerText = configBarFixed ? pt("plOn") : pt("plOff");
            renderCredits();
            if (typeof buildContentLangList === "function") buildContentLangList();
        }

        function checkVoiceAvailability(targetLang) {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            const lowerLang = targetLang.toLowerCase();
            const hasGender = voices.some(v => {
                const l = v.lang.toLowerCase();
                if (!l.startsWith(lowerLang) && !lowerLang.startsWith(l)) return false;
                if (configVoiceGender === "male") {
                    return v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("szabolcs") || v.name.toLowerCase().includes("david");
                } else {
                    return v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("tünde") || v.name.toLowerCase().includes("zsuzsa");
                }
            });
            const vBtn = document.getElementById("btnVoiceToggle");
            if (!hasGender && voices.length > 0) {
                vBtn.setAttribute("disabled", "true");
                vBtn.style.opacity = "0.5";
            } else {
                vBtn.removeAttribute("disabled");
                vBtn.style.opacity = "1";
            }
            updateUiLanguage();
        }

        // JAVASCRIPT OREKOS FORRAS 2 RESZ VEGE

                // === JAVASCRIPT 3. RÉSZ: ELRENDEZÉS ÉS AUDIÓ HIERARCHIA MŰKÖDTETÉSE ===
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                const langOverride = activeMagazineData?.pages[pageIdx]?.elements[blockIdx]?.lang || activeMagazineData?.lang || baseLang();
                checkVoiceAvailability(langOverride);
            };
        }

        function resetImageStyles() {
            const highlight = document.getElementById("focusHighlight");
            if (highlight) highlight.style.display = "none";
            const img = document.getElementById("comicImage");
            if (img) {
                img.style.transform = "none";
                img.style.opacity = "1";
            }
            subWindowIdx = 0;
        }

        function resizeLayout() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const viewport = document.getElementById("canvasViewport");
            const barHeightBottom = configBarFixed ? 54 : 0;
            const viewHeight = screenH - 46 - barHeightBottom;

            if (viewport) viewport.style.height = viewHeight + "px";
            
            const bBar = document.getElementById("bottomBar");
            if (configBarFixed) {
                bBar.classList.add("visible");
                if (viewport) viewport.style.marginBottom = "54px";
            } else {
                bBar.classList.remove("visible");
                if (viewport) viewport.style.marginBottom = "0px";
            }

            positionSubtitleBar();
            applyGuidedViewLogic(screenW, viewHeight);
        }

        // ⭐ FORDÍTÁSI RENDSZER - 2. réteg: "oldalID" / "oldalID:blokkID"
        // kulcs összeállítása - pontosan ugyanaz a formátum, mint amit a
        // szerver (lib/blockKeys.js) és az export (lib/exportEngine.js) is
        // használ, így a data.js "translations" mezője közvetlenül kikereshető.
        function contentKeyFor(pageId, blockId) {
            return (blockId === undefined || blockId === null || blockId === "") ? String(pageId) : `${pageId}:${blockId}`;
        }

        // A kiválasztott TARTALOM-nyelven (contentLang) visszaadja a szöveget,
        // ha van hozzá (nem üres) mentett fordítás - egyébként az eredetit.
        // "ORIG" esetén mindig az eredeti (nincs keresés).
        function translatedText(pageId, blockId, original) {
            if (contentLang === "ORIG" || !activeMagazineData) return original;
            const table = activeMagazineData.translations && activeMagazineData.translations[contentLang];
            if (!table) return original;
            const t = table[contentKeyFor(pageId, blockId)];
            return (typeof t === "string" && t.trim() !== "") ? t : original;
        }

        // F11: a feliratsáv SOHA nem takarhatja a vezérlést - az alsó sáv (Előző/
        // Következő) fölé kerül, ha az látszik, videó-oldalon pedig a videó saját
        // vezérlősávja (kb. 56 px) fölé is.
        function positionSubtitleBar() {
            const bar = document.getElementById("subtitleBar");
            const bBar = document.getElementById("bottomBar");
            if (!bar || !bBar) return;
            let offset = bBar.classList.contains("visible") ? 54 : 0;
            if (currentPageType() === "video") offset += 56;
            const vz = currentPageType() === "video" ? "block" : "none";
            const zl = document.getElementById("vzLeft"), zr = document.getElementById("vzRight");
            if (zl) zl.style.display = vz;
            if (zr) zr.style.display = vz;
            bar.style.bottom = offset + "px";
        }
        (function watchBottomBar() {
            const bBar = document.getElementById("bottomBar");
            if (bBar && window.MutationObserver) new MutationObserver(positionSubtitleBar).observe(bBar, { attributes: true, attributeFilter: ["class"] });
        })();

        function renderSubtitleBar(text) {
            const bar = document.getElementById("subtitleBar");
            if (!bar) return;
            positionSubtitleBar();
            bar.className = "txt-size-" + configTxtSize;
            if (subsActive && text) {
                bar.textContent = text;
                bar.style.display = "block";
            } else {
                bar.style.display = "none";
            }
        }

        function updateTextAndAudio(currentElement) {
            // ⭐ "Page" (oldal-szintű tartalom): ha a blokknak nincs saját
            // szövege (vagy nincs is blokk - pl. videó-oldalnál), az oldal
            // SAJÁT (page.text) szövege jelenik meg helyette.
            const currentPage = activeMagazineData.pages[pageIdx];
            const pageId = currentPage && currentPage.id;
            const blockIdForKey = (currentElement && currentElement.id !== undefined) ? currentElement.id : null;
            const blockTextOriginal = (currentElement && currentElement.content && currentElement.content.trim()) || "";
            const pageTextOriginal = (currentPage && currentPage.text && currentPage.text.trim()) || "";
            const blockText = blockTextOriginal ? translatedText(pageId, blockIdForKey, blockTextOriginal) : "";
            const pageText = pageTextOriginal ? translatedText(pageId, null, pageTextOriginal) : "";
            const wantedText = blockText || pageText;

            renderSubtitleBar(wantedText);

            let wantedAudio = "";
            if (soundActive) {
                wantedAudio = ((currentElement && currentElement.audioPath) || (currentPage && currentPage.audioPath) || "").trim();
            }

            if (wantedAudio) {
                // Ugyanaz a hang (pl. átméretezés miatti újrarajzolás): nem indítjuk újra.
                if (currentAudioKey !== wantedAudio) {
                    audioPlayer.pause();
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    audioPlayer.src = wantedAudio;
                    currentAudioKey = wantedAudio;
                    audioPlayer.play().catch(e => console.log("Audio hiba"));
                } else if (audioPlayer.paused && !audioPlayer.ended) {
                    audioPlayer.play().catch(e => console.log("Audio hiba"));
                }
                return;
            }

            audioPlayer.pause();
            currentAudioKey = "";
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            // A felolvasás csak akkor indul, ha a böngésző tud beszédszintézist (egyes beépített
            // böngészőkben nincs - ott a régi kód kivételt dobott, és megakasztotta a nézetet).
            // ⭐ FORDÍTÁSI RENDSZER - 2. réteg, nyitott pont lezárva: az eredeti,
            // FELVETT hangfájl (audioPath, ld. feljebb) mindig változatlan marad
            // nyelv-váltáskor - csak a gépi FELOLVASÁS (speechSynthesis) szövege
            // (és nyelve) vált a kiválasztott contentLang-ra, ha van hozzá fordítás.
            const speechTextOriginal = currentElement && currentElement.content;
            const speechText = speechTextOriginal ? translatedText(pageId, blockIdForKey, speechTextOriginal) : speechTextOriginal;

            if (soundActive && window.speechSynthesis && typeof SpeechSynthesisUtterance !== "undefined"
                && speechText && speechText.trim() !== "") {
                const utterance = new SpeechSynthesisUtterance(speechText);
                const langOverride = (contentLang !== "ORIG") ? contentLang : (currentElement.lang || activeMagazineData.lang || baseLang());

                const _ttsMap = { hu: "hu-HU", en: "en-US", de: "de-DE" };
                utterance.lang = _ttsMap[String(langOverride).toLowerCase()] || langOverride;
                utterance.rate = configSpeed;

                if (window.speechSynthesis) {
                    const voices = window.speechSynthesis.getVoices();
                    const lowerLang = utterance.lang.toLowerCase();
                    let chosenVoice = null;

                    for (let v of voices) {
                        const l = v.lang.toLowerCase();
                        if (l.startsWith(lowerLang) || lowerLang.startsWith(l)) {
                            const name = v.name.toLowerCase();
                            if (configVoiceGender === "male" && (name.includes("male") || name.includes("szabolcs") || name.includes("david"))) {
                                chosenVoice = v; break;
                            } else if (configVoiceGender === "female" && (name.includes("female") || name.includes("tünde") || name.includes("zsuzsa"))) {
                                chosenVoice = v; break;
                            }
                        }
                    }
                    if (!chosenVoice) {
                        for (let v of voices) {
                            const l = v.lang.toLowerCase();
                            if (l.startsWith(lowerLang) || lowerLang.startsWith(l)) { chosenVoice = v; break; }
                        }
                    }
                    if (chosenVoice) utterance.voice = chosenVoice;
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        // JAVASCRIPT REZIDENS FORRAS 3 RESZ VEGE

              // === JAVASCRIPT 4. RÉSZ: JAVÍTOTT NATÍV MOTOR (PADDING-ALAPÚ) ===
        function applyGuidedViewLogic(maxW, maxH) {
            const img = document.getElementById("comicImage");
            const highlight = document.getElementById("focusHighlight");
            const viewport = document.getElementById("canvasViewport");
            // F34: videó- és záróoldalon nincs kép (naturalWidth), de a szöveg/felirat
            // gombjai (📄, 💬) ott is frissítsék a megjelenítést.
            if (activeMagazineData && ["video", "credits"].includes(currentPageType())) { updateTextAndAudio(null); return; }
            if (!img || !img.naturalWidth || !activeMagazineData) return;

            const nw = img.naturalWidth;
            const nh = img.naturalHeight;
            const currentPage = activeMagazineData.pages[pageIdx];
            const elements = currentPage.elements || [];

            updateTextAndAudio(elements[blockIdx]);

            const scaleX = maxW / nw;
            const scaleY = maxH / nh;
            const baseScale = Math.min(scaleX, scaleY);

            const initialX = (maxW - (nw * baseScale)) / 2;
            const initialY = (maxH - (nh * baseScale)) / 2;

            if (blockIdx === -1 || !elements[blockIdx]) {
                img.style.width = nw + "px";
                img.style.height = nh + "px";
                img.style.transform = `translate(${initialX}px, ${initialY}px) scale(${baseScale})`;
                highlight.style.display = "none";
                
                viewport.style.paddingBottom = "0px";
                viewport.scrollTop = 0; 
                subWindowIdx = 0; 
            } else {
                highlight.style.display = "block";
                const block = elements[blockIdx];
                const bx1 = parseInt(block.x1) || 0; 
                const by1 = parseInt(block.y1) || 0;
                const bx2 = parseInt(block.x2) || nw; 
                const by2 = parseInt(block.y2) || nh;
                const bw = bx2 - bx1; 
                const bh = by2 - by1; 

                img.style.width = nw + "px";
                img.style.height = nh + "px";

                // A magazin-korszakban itt még két eltérő zoom-mód volt (a "Hasáb" típusú,
                // szélesség-kitöltő, függőlegesen görgethető szövegoszlopokhoz, és a "Kép"
                // típusú, mindkét irányban belülre illesztett paneleknek). Mivel csak
                // képregény-panelek maradtak, egységesen az utóbbi (kontain-fit) logika él.
                const zoomX = maxW / (bw * baseScale);
                const zoomY = maxH / (bh * baseScale);
                const zoom = Math.min(zoomX, zoomY) * 0.95;

                const totalScale = baseScale * zoom;
                const moveX = (maxW / 2) - ((bx1 + bw / 2) * totalScale);
                let moveY = -(by1 * totalScale);

                img.style.transform = `translate(${moveX}px, ${moveY}px) scale(${totalScale})`;

                highlight.style.left = (bx1 * totalScale + moveX) + "px";
                highlight.style.top = (by1 * totalScale + moveY) + "px";
                highlight.style.width = (bw * totalScale) + "px";
                highlight.style.height = (bh * totalScale) + "px";

                viewport.style.paddingBottom = "0px";
                subWindowIdx = 0;
            }
        }

        // JAVASCRIPT GUIDED VIEW MOTOR 4 RESZ VEGE





         // === JAVASCRIPT 5. RÉSZ: ZÓNÁS ÉRINTÉSVEZÉRLÉS ÉS TISZTA GÖRDÍTÉS ===
        let touchStartX = 0;
        let touchStartY = 0;
        let lastTapTime = 0;
        let longPressTimer = null;
        let isLongPress = false;
        let isMoving = false; // Figyeli, hogy történt-e ujjmozgatás (görgetés)

        const viewportElement = document.getElementById("canvasViewport");

        viewportElement.addEventListener("touchstart", (e) => {
            lastTouchAt = Date.now();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isLongPress = false;
            isMoving = false; // Minden új érintésnél alaphelyzet

            longPressTimer = setTimeout(() => {
                isLongPress = true;
                handleLongPress();
            }, 600);
        }, { passive: true });

        viewportElement.addEventListener("touchmove", (e) => {
            if (longPressTimer) clearTimeout(longPressTimer);
            // Ha az ujj elmozdul, akkor a felhasználó görget, nem pedig lapozni akar
            isMoving = true; 
        }, { passive: true });

        viewportElement.addEventListener("touchend", (e) => {
            if (longPressTimer) clearTimeout(longPressTimer);
            if (isLongPress) return;

            lastTouchAt = Date.now();
            const touch = e.changedTouches[0];
            const diffX = touch.clientX - touchStartX;
            const diffY = touch.clientY - touchStartY;
            const now = Date.now();

            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            // Videó-oldalon a lejátszó vezérlősávján nem lapozunk.
            if (isOnVideoControls(touch.clientY) || isOnVideoControls(touchStartY)) return;

            // F24/1: videóoldalon vízszintes suhintás is lapoz (balra = előre, jobbra = vissza).
            if (currentPageType() === "video" && Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                if (diffX < 0) triggerNext(); else triggerPrev();
                return;
            }

            // Alsó zónás swipe előhívás (alsó 10%)
            if (touchStartY > screenH * 0.9 && diffY < -30 && Math.abs(diffX) < 30) {
                if (!configBarFixed) {
                    const bBar = document.getElementById("bottomBar");
                    bBar.classList.add("visible");
                    setTimeout(() => { if (!configBarFixed) bBar.classList.remove("visible"); }, 4000);
                }
                return;
            }

            // Ha nem történt ujjmozgás (tiszta koppintás / tapicskolás történt)
            if (!isMoving) {
                // Megnézzük a kattintás pontos vízszintes helyét
                const clickX = touch.clientX;

                if (clickX > screenW * 0.75) {
                    // JOBB SZÉLSŐ 25%: Azonnali ugrás előre
                    triggerNext();
                    return;
                } else if (clickX < screenW * 0.25) {
                    // BAL SZÉLSŐ 25%: Azonnali ugrás hátra
                    triggerPrev();
                    return;
                } else {
                    // KÖZÉPSŐ 50%: Itt él a dupla koppintásos szövegkezelés
                    if (now - lastTapTime < 300) {
                        handleDoubleTap();
                        lastTapTime = 0;
                        return;
                    }
                    lastTapTime = now;
                }
            }
        }, { passive: true });

        function handleDoubleTap() {
            subsActive = !subsActive;
            document.getElementById("btnSubs").classList.toggle("active", subsActive);
            resizeLayout();
        }

        function handleLongPress() {
            soundActive = !soundActive;
            document.getElementById("btnSound").classList.toggle("active", soundActive);
            resizeLayout();
        }

        // Videó-oldalon az alsó negyed a lejátszó vezérlőié, ott koppintásra nem lapozunk.
        // F24/1: csak a TÉNYLEGES vezérlősáv (a videóelem alsó ~64 px-e) marad lapozásmentes,
        // nem a képernyő alsó negyede - így videólejátszás közben a képernyő bal és jobb
        // szélső 25%-a szinte teljes magasságában lapoz.
        const VIDEO_CONTROLS_PX = 64;
        function isOnVideoControls(clientY) {
            if (currentPageType() !== "video") return false;
            const rect = viewportElement.getBoundingClientRect();
            return clientY > rect.bottom - VIDEO_CONTROLS_PX;
        }

        // EGÉR (gépen): ugyanazok a zónák, mint érintésnél. Az érintés által generált
        // "click" eseményeket kihagyjuk, hogy ne lapozzon kétszer.
        viewportElement.addEventListener("click", (e) => {
            if (Date.now() - lastTouchAt < 700) return;
            if (isOnVideoControls(e.clientY)) return;
            const w = window.innerWidth;
            if (e.clientX > w * 0.75) triggerNext();
            else if (e.clientX < w * 0.25) triggerPrev();
        });
        viewportElement.addEventListener("dblclick", (e) => {
            if (Date.now() - lastTouchAt < 700) return;
            if (isOnVideoControls(e.clientY)) return;
            const w = window.innerWidth;
            if (e.clientX >= w * 0.25 && e.clientX <= w * 0.75) handleDoubleTap();
        });

        // BILLENTYŰZET (gépen): nyilak / PageUp-Down / szóköz = lapozás, T = szöveg, S = hang.
        document.addEventListener("keydown", (e) => {
            const popupOpen = ["popContentLang", "popSettings"].some(id => document.getElementById(id).style.display === "flex");
            if (popupOpen) return;
            switch (e.key) {
                case "ArrowRight": case "PageDown": case " ":
                    e.preventDefault(); triggerNext(); break;
                case "ArrowLeft": case "PageUp":
                    e.preventDefault(); triggerPrev(); break;
                case "t": case "T": handleDoubleTap(); break;
                case "s": case "S": handleLongPress(); break;
            }
        });

        // JAVASCRIPT GESZTUSMOTOR 5 RESZ VEGE






             // === JAVASCRIPT 6. RÉSZ: UNIVERZÁLIS, TISZTA NAVIGÁCIÓS MOTOR ===
        function triggerNext() {
            if (!activeMagazineData) return;
            const elements = activeMagazineData.pages[pageIdx].elements || [];
            const viewport = document.getElementById("canvasViewport");
            
            // Ha új blokkra lépünk, a görgetődobozt visszaállítjuk a tetejére
            if (viewport) {
                viewport.scrollTop = 0;
                viewport.style.paddingBottom = "0px";
            }
            
            if (blockIdx < elements.length - 1) { 
                blockIdx++; 
                resizeLayout(); 
            } else if (pageIdx < activeMagazineData.pages.length - 1) { 
                pageIdx++; 
                blockIdx = -1; 
                loadCurrentPage(); 
            }
        }

        function triggerPrev() {
            if (!activeMagazineData) return;
            const viewport = document.getElementById("canvasViewport");
            
            // Ha visszalépünk egy blokkot, a görgetődobozt visszaállítjuk a tetejére
            if (viewport) {
                viewport.scrollTop = 0;
                viewport.style.paddingBottom = "0px";
            }
            
            if (blockIdx > -1) { 
                blockIdx--; 
                resizeLayout(); 
            } else if (pageIdx > 0) { 
                pageIdx--; 
                const p = activeMagazineData.pages[pageIdx]; 
                blockIdx = p.elements?.length ? p.elements.length - 1 : -1; 
                loadCurrentPage(); 
            }
        }

        // JAVASCRIPT NAVIGACIOS LOGIKA 6 RESZ VEGE






              // === JAVASCRIPT 7. RÉSZ: ESEMÉNYKEZELŐK ÉS INICIALIZÁLÁS ===

            if (translationLangs.length) {
                const btnContentLang = document.getElementById("btnContentLang");
                btnContentLang.style.display = "flex";

                const listEl = document.getElementById("contentLangList");
                window.buildContentLangList = () => {
                listEl.innerHTML = "";
                const makeLangBtn = (code, label) => {
                    const b = document.createElement("button");
                    b.className = "lang-opt content-lang-opt" + (code === contentLang ? " active" : "");
                    b.textContent = label;
                    b.onclick = () => {
                        contentLang = code;
                        document.querySelectorAll(".content-lang-opt").forEach(x => x.classList.remove("active"));
                        b.classList.add("active");
                        document.getElementById("popContentLang").style.display = "none";
                        resizeLayout();
                    };
                    return b;
                };
                listEl.appendChild(makeLangBtn("ORIG", pt("plOriginal") + " (" + baseLang().toUpperCase() + ")"));
                translationLangs.forEach(code => listEl.appendChild(makeLangBtn(code, code.toUpperCase())));
                };
                window.buildContentLangList();

                btnContentLang.onclick = () => { document.getElementById("popContentLang").style.display = "flex"; };
                document.getElementById("btnCloseContentLang").onclick = () => { document.getElementById("popContentLang").style.display = "none"; };
            }

            // Beállítások (Hamburger) ablak logikája
            document.getElementById("btnSizeS").onclick = function() {
                configTxtSize = "small";
                document.getElementById("btnSizeS").classList.add("active");
                document.getElementById("btnSizeM").classList.remove("active");
                document.getElementById("btnSizeL").classList.remove("active");
            };
            document.getElementById("btnSizeM").onclick = function() {
                configTxtSize = "medium";
                document.getElementById("btnSizeS").classList.remove("active");
                document.getElementById("btnSizeM").classList.add("active");
                document.getElementById("btnSizeL").classList.remove("active");
            };
            document.getElementById("btnSizeL").onclick = function() {
                configTxtSize = "large";
                document.getElementById("btnSizeS").classList.remove("active");
                document.getElementById("btnSizeM").classList.remove("active");
                document.getElementById("btnSizeL").classList.add("active");
            };

            document.getElementById("btnSpeedS").onclick = function() {
                configSpeed = 0.8;
                document.getElementById("btnSpeedS").classList.add("active");
                document.getElementById("btnSpeedN").classList.remove("active");
                document.getElementById("btnSpeedF").classList.remove("active");
            };
            document.getElementById("btnSpeedN").onclick = function() {
                configSpeed = 1.0;
                document.getElementById("btnSpeedS").classList.remove("active");
                document.getElementById("btnSpeedN").classList.add("active");
                document.getElementById("btnSpeedF").classList.remove("active");
            };
            document.getElementById("btnSpeedF").onclick = function() {
                configSpeed = 1.3;
                document.getElementById("btnSpeedS").classList.remove("active");
                document.getElementById("btnSpeedN").classList.remove("active");
                document.getElementById("btnSpeedF").classList.add("active");
            };

            document.getElementById("btnVoiceToggle").onclick = function() {
                if (this.getAttribute("disabled")) return;
                configVoiceGender = (configVoiceGender === "female") ? "male" : "female";
                const langOverride = activeMagazineData?.pages[pageIdx]?.elements[blockIdx]?.lang || activeMagazineData?.lang || baseLang();
                checkVoiceAvailability(langOverride);
            };

            document.getElementById("btnBarToggle").onclick = function() {
                configBarFixed = !configBarFixed;
                updateUiLanguage();
            };

            document.getElementById("btnCloseSettings").onclick = () => {
                document.getElementById("popSettings").style.display = "none";
                resizeLayout();
            };
        });
    </script>
</body>
</html>
